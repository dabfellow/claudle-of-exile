  accent-color: var(--accent);
}

.input.lg {
  width: 100%;
  padding: 11px 14px;
  font-size: var(--fs-md);
  font-family: var(--font-display);
  letter-spacing: 0.03em;
}

.crest {
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--class) 30%, transparent), color-mix(in srgb, var(--class) 6%, var(--bg-2)) 70%);
  border: 1px solid color-mix(in srgb, var(--class) 55%, transparent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--class) 25%, transparent);
}

.char-card {
  transition: border-color 0.2s, transform 0.2s;
}

.char-card:hover {
  border-color: color-mix(in srgb, var(--class) 60%, var(--line));
  transform: translateY(-2px);
}

.char-name {
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  font-weight: 700;
}

.new-char {
  border-style: dashed;
  background: transparent;
}

.class-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}

.class-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  cursor: pointer;
  color: inherit;
  font: inherit;
  transition: transform 0.2s var(--ease), border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
  opacity: 0.72;
}

.class-card:hover {
  opacity: 1;
  transform: translateY(-3px);
}

.class-card.locked,
.class-card.locked:hover {
  opacity: 0.45;
  transform: none;
  cursor: not-allowed;
}

.class-card.chosen {
  opacity: 1;
  border-color: var(--class);
  box-shadow: 0 0 0 1px var(--class), 0 14px 40px color-mix(in srgb, var(--class) 22%, transparent);
}

.class-card.chosen .crest {
  animation: glow-class 2.6s ease-in-out infinite;
}

.class-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
}

.class-attr {
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--class);
  margin-top: -6px;
}

.class-tag {
  font-style: italic;
  color: var(--accent-2);
}

.class-attrs {
  display: flex;
  gap: 14px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.class-attrs b {
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
}

.class-section {
  width: 100%;
  padding-top: 8px;
  border-top: 1px solid var(--line);
}

.create-bar {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-wrap: wrap;
}

.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  padding: 28px;
}

.char-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 4px 10px;
}

.char-foot-name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.account-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.account-badge .provider {
  width: 18px;
  height: 18px;
  font-size: var(--fs-2xs);
}

.sync {
  font-size: var(--fs-xs);
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
}

.sync.synced { color: var(--good); border-color: color-mix(in srgb, var(--success) 55%, transparent); }
.sync.saving { color: var(--accent-2); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.sync.offline { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }

.admin-event {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}

.guest-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  background: linear-gradient(180deg, var(--accent-soft), transparent), var(--panel);
}

.guest-banner > div {
  flex: 1;
}

.demo-banner {
  margin-bottom: var(--s-4);
}

.account-form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* the display font has no lowercase, which hides typos in an email address */
.title-card .input.lg {
  font-family: inherit;
  letter-spacing: normal;
}

.account-form-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
}

.link-btn {
  background: none;
  border: none;
  padding: 0;
  color: var(--muted);
  font: inherit;
  font-size: var(--fs-xs);
  text-decoration: underline;
  cursor: pointer;
}

.link-btn:hover {
  color: var(--text);
}

/* ============ tutorial ============ */
.quest {
  margin: 10px;
  padding: 12px;
  border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line));
  background: linear-gradient(180deg, var(--accent-soft), transparent), var(--panel-2);
  display: flex;
  flex-direction: column;
  gap: 8px;
  animation: quest-in 0.45s var(--ease);
}

.quest.floating {
  display: none;
}

.quest-portrait {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--bg-2);
  border: 1px solid var(--accent);
  flex: none;
}

.quest-step {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
}

.quest-title {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--accent-2);
}

.quest-npc {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.5;
}

.quest-npc b {
  color: var(--text);
}

.quest-objective {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
  font-size: var(--fs-sm);
}

.quest-objective::before {
  content: '◆';
  color: var(--accent);
  margin-right: -2px;
}

.quest-objective span:first-child {
  flex: 1;
}

.quest-reward {
  font-size: var(--fs-xs);
  color: var(--currency);
}

.tut-hint {
  position: relative;
  animation: tut-pulse 1.4s ease-in-out infinite !important;
  border-color: var(--accent) !important;
}

.nav-item.tut-hint {
  background: var(--accent-soft);
  color: var(--text);
}

g.tut-hint circle.body {
  stroke: var(--accent-2) !important;
  stroke-width: 4;
}

@keyframes tut-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-2) 55%, transparent); }
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent-2) 0%, transparent), 0 0 22px color-mix(in srgb, var(--accent-2) 45%, transparent); }
}

@keyframes quest-in {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
}

@keyframes glow-class {
  50% { box-shadow: 0 0 34px color-mix(in srgb, var(--class) 55%, transparent); }
}

@media (max-width: 1200px) {
  .quest.floating {
    display: flex;
    position: fixed;
    right: 12px;
    bottom: 52px; /* clear the xp bar */
    width: min(320px, calc(100vw - 24px));
    margin: 0;
    z-index: 60;
    box-shadow: var(--shadow);
  }
}

/* ============ always-on xp bar ============ */
.xpbar {
  grid-area: xp;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-top: 1px solid var(--line);
  background: var(--panel);
  position: relative;
  z-index: 4;
}

.xp-level {
  font-family: var(--font);
  font-weight: 700;
  color: var(--accent-2);
  white-space: nowrap;
  font-size: var(--fs-md);
  min-width: 64px;
}

.xp-track {
  position: relative;
  flex: 1;
  height: 14px;
  border-radius: 7px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.xp-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, var(--bg)), var(--accent) 70%, var(--accent-2));
  box-shadow: 0 0 12px var(--accent-glow);
  transition: width 0.4s var(--ease);
}

.xp-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
  background-size: 200% 100%;
  animation: xp-sheen 3.2s linear infinite;
}

.xp-ticks {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0, 0, 0, 0.55) calc(10% - 1px) 10%);
  pointer-events: none;
}

.xp-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: var(--fs-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px #000, 0 0 2px #000;
  letter-spacing: 0.02em;
}

.xp-track.gain-a {
  animation: xp-pulse 0.5s ease-out;
}

.xp-track.gain-b {
  animation: xp-pulse-b 0.5s ease-out;
}

.xp-rate {
  font-size: var(--fs-xs);
  color: var(--muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 92px;
  text-align: right;
}

.xp-skill {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 230px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.xp-skill .bar {
  flex: 1;
  height: 8px;
}

.xp-pop {
  position: absolute;
  bottom: 34px;
  font-weight: 800;
  font-size: var(--fs-xs);
  color: var(--accent-2);
  text-shadow: 0 1px 3px #000;
  pointer-events: none;
  animation: float-up 1.2s ease-out forwards;
  white-space: nowrap;
}

.xp-levelup {
  position: absolute;
  inset: -4px 0 auto 0;
  height: 4px;
  background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
  animation: levelup-sweep 1.4s ease-out forwards;
}

.topbar-life {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.bar.thin {
  height: 6px;
}

.topbar-life .bar.thin {
  height: 4px;
}

@keyframes xp-sheen {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

@keyframes xp-pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-2) 60%, transparent); }
  100% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-2) 0%, transparent); }
}

@keyframes xp-pulse-b {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-2) 60%, transparent); }
  100% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-2) 0%, transparent); }
}

@keyframes levelup-sweep {
  0% { opacity: 0; transform: scaleX(0.1); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: scaleX(1); }
}

@media (max-width: 860px) {
  .xp-skill,
  .xp-rate {
    display: none;
  }
  .xpbar {
    padding: 8px 12px;
  }
}

/* ============ gems & skills ============ */
.gem-icon {
  --shape: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%);
  position: relative;
  display: inline-block;
  flex: none;
  clip-path: var(--shape);
  /* the rim */
  background: color-mix(in srgb, var(--gem) 50%, #efe4c8);
  transition: filter 0.2s;
}

/* twelve-sided support gems */
.gem-icon.support {
  --shape: polygon(98.3% 37.1%, 98.3% 62.9%, 85.4% 85.4%, 62.9% 98.3%, 37.1% 98.3%, 14.6% 85.4%, 1.7% 62.9%, 1.7% 37.1%, 14.6% 14.6%, 37.1% 1.7%, 62.9% 1.7%, 85.4% 14.6%);
}

.gem-face {
  position: absolute;
  inset: var(--rim, 3px);
  display: grid;
  place-items: center;
  clip-path: var(--shape);
  background: color-mix(in srgb, var(--gem) 80%, #15110c);
}

.gem-glyph {
  width: 64%;
  height: 64%;
  background: rgba(255, 250, 240, 0.94);
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
}

.gem-icon.support .gem-glyph {
  width: 60%;
  height: 60%;
}

.gem-initials {
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
}

.gem-icon.dim {
  filter: grayscale(0.7) brightness(0.55);
}

.gem-tip {
  min-width: 260px;
}

.gem-tip-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.gem-slot {
  display: grid;
  grid-template-columns: 26px auto minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 12px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.gem-slot.empty {
  grid-template-columns: 26px 1fr;
  border-style: dashed;
  opacity: 0.8;
}

.gem-slot.target {
  cursor: pointer;
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent-glow);
}

.gem-slot-main {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.slot-key {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--muted);
}

.sockets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.socket {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 5px;
  border-radius: 999px;
  border: 1px dashed var(--line-2);
  background: var(--bg-2);
  font-size: var(--fs-xs);
  cursor: pointer;
  color: var(--text);
}

.socket:disabled {
  cursor: default;
}

.socket.filled {
  border-style: solid;
}

.socket.target {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-glow);
  animation: tut-pulse 1.4s ease-in-out infinite;
}

.socket.open {
  border-color: var(--accent);
  border-style: solid;
}

/* an empty twelve-sided setting, the shape of the support gem that goes in it */
.socket-hole {
  width: 18px;
  height: 18px;
  clip-path: polygon(98.3% 37.1%, 98.3% 62.9%, 85.4% 85.4%, 62.9% 98.3%, 37.1% 98.3%, 14.6% 85.4%, 1.7% 62.9%, 1.7% 37.1%, 14.6% 14.6%, 37.1% 1.7%, 62.9% 1.7%, 85.4% 14.6%);
  background: var(--line-2);
  position: relative;
}

.socket-hole::after {
  content: '';
  position: absolute;
  inset: 2px;
  clip-path: inherit;
  background: #0b0907;
}

.socket-picker {
  margin-top: 8px;
  padding: 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--bg-2);
}

.socket-picker-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.gem-card.missing {
  cursor: default;
  opacity: 0.75;
}

.rule-editor {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.rule-editor select.input {
  max-width: 220px;
  font-size: var(--fs-xs);
}

/* Combat Rule Editor */
.rule-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  margin-bottom: 6px;
  width: 100%;
  box-sizing: border-box;
  transition: border-color 0.15s ease;
}

.rule-card:hover {
  border-color: var(--line);
}

.rule-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  width: 100%;
}

.rule-condition-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(180deg, #1b2027 0%, #11151b 100%);
  border: 1px solid var(--line-2);
  color: var(--text);
  padding: 5px 12px;
  border-radius: var(--r-sm);
  font: inherit;
  font-size: var(--fs-xs);
  cursor: pointer;
  transition: all 0.15s ease;
}

.rule-condition-btn:hover {
  border-color: var(--accent-line);
  color: var(--accent-2);
  box-shadow: 0 0 8px rgba(209, 173, 114, 0.2);
}

.rule-condition-btn.is-locked {
  opacity: 0.6;
  border-color: var(--danger);
}

.rule-condition-btn .glyph {
  color: var(--accent);
}

.rule-condition-btn .arrow {
  color: var(--accent);
  font-size: 10px;
  margin-left: 2px;
}

.rule-params {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-top: 6px;
  border-top: 1px dashed rgba(255, 255, 255, 0.08);
}

.rule-chip-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.chip.status-chip,
.chip.ground-chip,
.chip.aim-chip {
  cursor: pointer;
  background: #14181f;
  border: 1px solid var(--line-2);
  color: var(--muted);
  transition: all 0.15s ease;
  user-select: none;
}

.chip.status-chip:hover,
.chip.ground-chip:hover,
.chip.aim-chip:hover {
  border-color: var(--accent-line);
  color: var(--text);
}

.chip.status-chip.active,
.chip.ground-chip.active,
.chip.aim-chip.active {
  background: var(--panel-2);
  border-color: var(--accent);
  color: var(--accent-2);
  box-shadow: 0 0 6px rgba(209, 173, 114, 0.25);
  font-weight: 600;
}

.chip.status-chip.status-bleeding.active {
  border-color: var(--life-2);
  color: #ff998f;
  box-shadow: 0 0 6px rgba(208, 103, 91, 0.3);
}

.chip.status-chip.status-poisoned.active {
  border-color: var(--poison);
  color: #bbf082;
  box-shadow: 0 0 6px rgba(159, 194, 106, 0.3);
}

.chip.status-chip.status-ignited.active {
  border-color: var(--fire);
  color: #ffaa7d;
  box-shadow: 0 0 6px rgba(224, 122, 76, 0.3);
}

.chip.status-chip.status-chilled.active {
  border-color: var(--cold);
  color: #aae0ff;
  box-shadow: 0 0 6px rgba(127, 200, 248, 0.3);
}

.chip.status-chip.status-shocked.active {
  border-color: var(--lightning);
  color: #fff28f;
  box-shadow: 0 0 6px rgba(238, 219, 104, 0.3);
}

.rule-stepper-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.rule-num-input {
  width: 52px !important;
  text-align: center;
  padding: 3px 6px !important;
}

.rule-aim-panel {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  margin-top: 4px;
}

/* Rule condition picker modal */
.rule-modal {
  max-width: 580px;
  width: 95vw;
}

.rule-modal-categories {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.rule-modal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 6px;
  max-height: 60vh;
  overflow-y: auto;
  padding-right: 4px;
}

.rule-opt-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  padding: 8px 12px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s ease;
}

.rule-opt-card:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--panel-2);
  box-shadow: 0 0 8px rgba(209, 173, 114, 0.2);
}

.rule-opt-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-2);
}

.rule-opt-card:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  border-color: var(--line);
}

.rule-opt-title {
  font-weight: 600;
  font-size: var(--fs-xs);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Combat Page Targeting */
.bf-target-container {
  position: relative;
  display: inline-flex;
}

.bf-target-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  color: var(--text);
  padding: 3px 10px;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  cursor: pointer;
  transition: all 0.15s ease;
}

.bf-target-toggle:hover,
.bf-target-toggle.active {
  border-color: var(--accent-line);
  color: var(--accent-2);
  box-shadow: 0 0 6px rgba(209, 173, 114, 0.15);
}

.bf-target-popover {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 50;
  min-width: 280px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  border-radius: var(--r);
  padding: 10px 12px;
}

/* Greenhouse Conservatory */
.greenhouse-conservatory {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.greenhouse-plot-card {
  background: linear-gradient(180deg, #131a15 0%, #0d120f 100%);
  border: 1px solid #273e2d;
  border-radius: var(--r);
  padding: 14px 16px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

.greenhouse-plot-empty {
  border-style: dashed;
  border-color: var(--line-2);
  background: var(--bg-2);
}

.greenhouse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

.greenhouse-crop-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  transition: all 0.15s ease;
}

.greenhouse-crop-card:hover {
  border-color: var(--line);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.greenhouse-crop-card.active {
  border-color: #558b6e;
  background: linear-gradient(180deg, #17241b 0%, #111b14 100%);
  box-shadow: 0 0 10px rgba(85, 139, 110, 0.25);
}

.greenhouse-crop-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.greenhouse-crop-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--fs-xs);
}

.greenhouse-crop-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-top: auto;
}

.gem-bag {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 6px;
}

.gem-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--bg-2);
  cursor: pointer;
  text-align: left;
  font-size: var(--fs-sm);
  transition: border-color 0.15s, transform 0.1s;
}

.gem-card:hover {
  border-color: var(--line-2);
}

.gem-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* skills page: search + chips over each gem list */
.gem-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  margin-bottom: 12px;
}

.gem-search {
  width: 180px;
}

.gem-chips {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
}

.gem-chip {
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--muted);
  font: inherit;
  font-size: var(--fs-xs);
  font-weight: 600;
  cursor: pointer;
}

.gem-chip:hover {
  color: var(--text);
}

.gem-chip.active {
  color: var(--text);
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 16%, var(--bg-2));
}

.gem-chip.attr-str.active { border-color: var(--str); background: color-mix(in srgb, var(--str) 20%, var(--bg-2)); }
.gem-chip.attr-dex.active { border-color: var(--dex); background: color-mix(in srgb, var(--dex) 20%, var(--bg-2)); }
.gem-chip.attr-int.active { border-color: var(--int); background: color-mix(in srgb, var(--int) 20%, var(--bg-2)); }

.gem-card.nofit {
  opacity: 0.55;
}

/* ============ combat 2.0 ============ */
.arena2 {
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  gap: var(--s-4);
  align-items: stretch;
  padding: var(--s-5);
  background: radial-gradient(600px 260px at 70% 40%, color-mix(in srgb, var(--zone, var(--line-2)) 18%, transparent), transparent 70%),
    var(--panel);
  overflow: visible;
}

.arena2 .vs {
  align-self: center;
}

/* ---- battlefield: a half-ring of hexes, the player on the bottom edge (docs/GAME.md) ---- */
.arena-side {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  min-width: 0;
}

.bf-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  min-width: 0;
}

.bf-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.chained-anchor {
  position: relative;
  height: 0;
  z-index: 5;
  pointer-events: none;
}
.chained-notice {
  position: absolute;
  inset: 0 0 auto;
  color: var(--text);
  backdrop-filter: blur(4px);
}
.chained-notice b { color: var(--text); }

/* a fixed share of the bar, so the changing text never rewraps the controls and moves the field */
.bf-status {
  flex: 1 1 100px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}

.bf-auto,
.bf-target {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--muted);
  cursor: pointer;
}

.input.sm {
  padding: 3px 6px;
  font-size: var(--fs-sm);
}

.battlefield {
  position: relative;
  width: 100%;
  /* 1.95 is the field's shape: short screens get a smaller field, so the skills and flasks under it stay in view */
  max-width: min(820px, max(480px, calc((100dvh - 565px) * 1.95)));
  margin: 0 auto;
}

.bf-cell {
  position: absolute;
  display: grid;
  place-items: center;
}

/* every hex is a dark tile with a hairline gap, so the zone art shows between them */
.bf-cell::before {
  content: '';
  position: absolute;
  inset: 2.5%;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background: rgba(0, 0, 0, 0.3);
  transition: background 0.2s;
}

/* rings fade outward; ring 1 (melee range) has a warm edge, the outer edge (where monsters walk in) is darkest */
.bf-cell.ring-1::before {
  background: color-mix(in srgb, var(--accent) 14%, rgba(0, 0, 0, 0.36));
}
.bf-cell.ring-2::before { background: rgba(0, 0, 0, 0.32); }
.bf-cell.ring-3::before { background: rgba(0, 0, 0, 0.28); }
.bf-cell.ring-4::before { background: rgba(0, 0, 0, 0.42); }

.bf-cell.occupied::before {
  background: color-mix(in srgb, var(--danger) 18%, rgba(0, 0, 0, 0.42));
}
.bf-cell.occupied.target::before {
  background: color-mix(in srgb, var(--accent) 30%, rgba(0, 0, 0, 0.4));
}
.bf-cell.occupied.boss::before {
  background: color-mix(in srgb, var(--life-2) 30%, rgba(0, 0, 0, 0.45));
}

/* ground hazards tint the tile; a skill's area flashes the tiles it covers */
.bf-cell[class*='ground-']::before {
  animation: ground-pulse 1.6s ease-in-out infinite;
}
.bf-cell.ground-burning::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--fire) 55%, transparent), color-mix(in srgb, var(--fire) 22%, rgba(0, 0, 0, 0.5))); }
.bf-cell.ground-frozen::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--cold) 70%, white), color-mix(in srgb, var(--cold) 30%, rgba(0, 0, 0, 0.5))); }
.bf-cell.ground-chilled::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--cold) 50%, transparent), color-mix(in srgb, var(--cold) 20%, rgba(0, 0, 0, 0.5))); }
.bf-cell.ground-shocked::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--light) 50%, transparent), color-mix(in srgb, var(--light) 20%, rgba(0, 0, 0, 0.5))); }
.bf-cell.ground-stormwater::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--cold) 45%, transparent), color-mix(in srgb, var(--light) 25%, rgba(0, 0, 0, 0.5))); }
.bf-cell.ground-unholy::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--accent-2) 55%, black), color-mix(in srgb, var(--accent-2) 20%, rgba(0, 0, 0, 0.6))); }
.bf-cell.ground-caustic::before { background: radial-gradient(closest-side, color-mix(in srgb, var(--poison) 50%, transparent), color-mix(in srgb, var(--poison) 20%, rgba(0, 0, 0, 0.5))); }

.bf-cell.flash-a::after,
.bf-cell.flash-b::after {
  content: '';
  position: absolute;
  inset: 2.5%;
  z-index: 3;
  pointer-events: none;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent-2) 65%, transparent), color-mix(in srgb, var(--accent-2) 20%, transparent));
  opacity: 0;
}
.bf-cell.flash-a::after { animation: area-flash 0.45s ease-out; }
.bf-cell.flash-b::after { animation: area-flash-b 0.45s ease-out; }

@keyframes area-flash {
  0% { opacity: 0.9; }
  100% { opacity: 0; }
}
@keyframes area-flash-b {
  0% { opacity: 0.9; }
  100% { opacity: 0; }
}
@keyframes ground-pulse {
  50% { filter: brightness(1.35); }
}

/* the player's own hex on the bottom edge */
.bf-player-cell::before {
  background: color-mix(in srgb, var(--accent) 35%, rgba(0, 0, 0, 0.45));
}
.bf-player-cell .portrait {
  position: relative;
  width: 46%;
  height: auto;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid var(--accent);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent);
}
.bf-player-cell.lunge-a .portrait { animation: lunge 0.35s ease-out; }
.bf-player-cell.lunge-b .portrait { animation: lunge-b 0.35s ease-out; }
@keyframes lunge {
  40% { transform: translateY(-14%) scale(1.12); }
}
@keyframes lunge-b {
  40% { transform: translateY(-14%) scale(1.12); }
}

/* a monster stands on the hex centre; stepping slides it to the next hex, arriving walks it in from past the edge */
.bf-unit {
  position: absolute;
  z-index: 2;
  transform: translate(-50%, -50%);
  transition-property: left, top;
  transition-timing-function: ease-in-out;
  cursor: pointer;
  animation: bf-walk-in 0.7s ease-out;
}
.bf-unit.boss {
  z-index: 4;
}
@keyframes bf-walk-in {
  from {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)));
    opacity: 0;
  }
}

.bf-token {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  padding: 4px 5px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid var(--line);
  backdrop-filter: blur(2px);
}

.bf-token.targeted {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 16px color-mix(in srgb, var(--accent) 25%, transparent);
}

.bf-token.locked {
  border-width: 2px;
  border-style: dashed;
}

.bf-token.martyr {
  border-color: var(--accent-2);
  border-style: dashed;
}

.bf-token.chained {
  box-shadow: 0 0 0 2px var(--ward);
}

.bf-token.minion {
  border-color: color-mix(in srgb, var(--es) 70%, var(--line));
}

.bf-token.minion.taunts {
  border-width: 2px;
}

.bf-unit.ally {
  cursor: default;
  animation: none;
}

.bf-cell.storm::before {
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55) 35%, color-mix(in srgb, var(--storm) 45%, transparent));
  animation: bf-storm 1.6s ease-in-out infinite alternate;
}
.bf-cell.storm-phys { --storm: var(--dim); }
.bf-cell.storm-fire { --storm: var(--fire); }
.bf-cell.storm-cold { --storm: var(--cold); }
.bf-cell.storm-light { --storm: var(--light); }
@keyframes bf-storm {
  to {
    filter: brightness(1.5);
  }
}

.bf-token.boss {
  border-color: color-mix(in srgb, var(--danger) 60%, var(--line));
  box-shadow: 0 0 24px color-mix(in srgb, var(--danger) 20%, transparent);
}

.bf-token.casting {
  border-color: var(--life-2);
  animation: pulse 0.6s infinite;
}

.bf-token-head {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

.bf-token-name {
  flex: 1;
  min-width: 0;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.portrait.tiny {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  flex: none;
}

.bf-token .target-pip {
  margin-left: 0;
  width: 7px;
  height: 7px;
  flex: none;
}

/* ranged monsters wear a small blue dot */
.bf-ranged {
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--mana-2);
}

.bf-approach {
  font-size: 9px;
  color: var(--dim);
  font-style: italic;
  white-space: nowrap;
}

.bf-pips {
  display: flex;
  gap: 3px;
}

.bf-pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.bf-empty {
  position: absolute;
  inset: 0 0 30% 0;
  display: grid;
  place-items: center;
  color: var(--dim);
  font-size: var(--fs-sm);
}

/* the field needs the width: below this the player card and matchup sit side by side under it */
@media (max-width: 1700px) {
  .arena2 {
    grid-template-columns: minmax(0, 1fr);
  }
  .arena2 .bf-wrap {
    order: -1;
  }
  .arena-side {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }
  .matchup-card {
    height: 300px;
  }
  /* room for the area line to wrap, so it can't push the field down when it does */
  .combat-page .page-head p {
    min-height: 2lh;
  }
}

/* narrow screens get a summary instead of the field */
.bf-summary {
  display: none;
  flex-direction: column;
  gap: 8px;
  font-size: var(--fs-sm);
}
.bf-summary-target {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
@media (max-width: 700px) {
  .battlefield {
    display: none;
  }
  .bf-summary {
    display: flex;
  }
  /* no field to float over here, and the summary's Strike buttons sit right under it */
  .chained-anchor {
    height: auto;
  }
  .chained-notice {
    position: static;
  }
}

.pack {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}

.pack.pack-1 {
  grid-template-columns: minmax(0, 340px);
}

.fighter.monster {
  gap: 7px;
  padding: 12px;
}

.fighter.targeted {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
}

/* how you stack up against the monster you're hitting; a set size that scrolls, so nothing around it moves */
.matchup-card {
  flex: 1 1 0;
  min-height: 220px;
  display: grid;
  align-content: start;
  gap: 8px;
  padding: 12px;
  overflow-y: auto;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-2) 85%, transparent);
}

/* skills and flasks on one bar right under the field */
.action-bar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: var(--s-3);
  align-items: start;
  padding: 8px 10px 10px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-2) 85%, transparent);
}

.action-bar .btn.sm {
  min-height: 0;
  padding: 1px 6px;
}

.action-bar .skill-btn {
  min-height: 92px;
  padding: 6px 4px;
}

.action-bar .skill-rule {
  display: none;
}

.action-bar .skill-btn.unusable .skill-rule {
  display: block;
}

.action-bar .flask {
  width: 48px;
}

.action-bar .flask-charges {
  font-size: var(--fs-2xs);
}

/* the challenge button keeps its size whatever it says, so the header doesn't reflow over the field */
.btn.challenge {
  display: block;
  width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.action-bar-group {
  display: grid;
  gap: 8px;
  min-width: 0;
}

.action-bar-group.flasks {
  padding-left: var(--s-3);
  border-left: 1px solid var(--line);
}

.action-bar-label {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 20px;
  font-size: var(--fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}

.action-bar-label .card-hint {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 400;
}

@container (min-width: 640px) {
  .action-bar .skill-bar {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}

@container (max-width: 639px) {
  .action-bar {
    grid-template-columns: minmax(0, 1fr);
  }
  .action-bar-group.flasks {
    padding-left: 0;
    border-left: 0;
  }
}

.target-label {
  font-size: var(--fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}

.fighter.searching,
.fighter.dead {
  align-items: center;
  justify-content: center;
  color: var(--dim);
  min-height: 80px;
  font-size: var(--fs-sm);
}

.fighter.dead {
  opacity: 0.35;
  animation: fade-in 0.3s;
}

.portrait.small {
  width: 38px;
  height: 38px;
  border-radius: 10px;
}

.fighter-name.small {
  font-size: var(--fs-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.target-pip {
  margin-left: auto;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: pulse 1.2s infinite;
}

.life-stack {
  position: relative;
}

.shield-bar {
  position: absolute;
  left: 0;
  top: -5px;
  height: 4px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--cold), var(--text));
  box-shadow: 0 0 8px var(--cold);
  transition: width 0.2s;
}

.shield-bar.overfill {
  box-shadow: 0 0 10px var(--cold), 0 0 4px #fff;
}

.shield-overfill {
  position: absolute;
  right: 0;
  top: -14px;
  font-size: 9px;
  font-weight: 800;
  color: var(--cold);
  text-shadow: 0 0 4px #000;
}

.action-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 2px 8px;
  font-size: var(--fs-xs);
}

.action-line > :first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.action-line > :last-child {
  grid-column: 1 / -1;
}

.status-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  min-height: 20px;
}

.status {
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--muted);
}

.status.good { color: var(--good); border-color: color-mix(in srgb, var(--success) 55%, transparent); }
.status.bad { color: var(--bad); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.status.cold { color: var(--cold); border-color: color-mix(in srgb, var(--cold) 45%, transparent); }
.status.fire { color: var(--fire); border-color: color-mix(in srgb, var(--fire) 45%, transparent); }
.status.poison { color: var(--poison); border-color: color-mix(in srgb, var(--poison) 45%, transparent); }

.floater.block {
  color: var(--phys);
  font-size: var(--fs-sm);
}

.floater.dot {
  font-size: var(--fs-xs);
  opacity: 0.85;
}

.skill-bar {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}

.skill-btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 6px 7px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: linear-gradient(180deg, var(--panel-2), var(--bg-2));
  cursor: pointer;
  min-height: 112px;
  transition: transform 0.08s, border-color 0.15s, box-shadow 0.2s;
}

.skill-btn:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--line-2) 60%, var(--muted));
}

.skill-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.skill-btn:disabled {
  cursor: default;
}

.skill-btn.empty {
  border-style: dashed;
  opacity: 0.4;
  justify-content: center;
}

/* the Skills page draws the bar the same way, with a priority number, supports and a drop target */
.skill-btn.setup {
  min-height: 150px;
}

.skill-btn.setup.empty {
  opacity: 0.6;
}

.skill-btn.target {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
  opacity: 1;
}

.skill-prio {
  position: absolute;
  top: 5px;
  right: 7px;
  font-size: var(--fs-2xs);
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.skill-supports {
  display: flex;
  gap: 3px;
  min-height: 16px;
  align-items: center;
}

.socket-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px dashed var(--line-2);
}

.slot-modal {
  width: min(640px, 100%);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.slot-modal .card-title {
  gap: 10px;
}

.slot-modal .slot-key {
  position: static;
}

.slot-modal .rule-editor {
  justify-content: flex-start;
}

.rule-join {
  font-size: var(--fs-xs);
  color: var(--dim);
}

.cast-order {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}

.prio-pick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.skill-btn .slot-key {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 20px;
  height: 20px;
  font-size: var(--fs-2xs);
}

.skill-btn.queued {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.skill-btn.unusable .skill-rule {
  color: var(--danger);
}

.skill-btn.nomana .skill-meta {
  color: var(--bad);
}

.skill-btn.used-a {
  animation: skill-flash 0.45s ease-out;
}

.skill-btn.used-b {
  animation: skill-flash-b 0.45s ease-out;
}

.skill-gem {
  position: relative;
  display: grid;
  place-items: center;
}

.cd-sweep {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(rgba(0, 0, 0, 0.65) var(--cd), transparent 0);
  pointer-events: none;
}

.cd-text {
  position: absolute;
  font-weight: 800;
  font-size: var(--fs-xs);
  text-shadow: 0 1px 2px #000;
}

.skill-name {
  font-weight: 700;
  font-size: var(--fs-xs);
  text-align: center;
  line-height: 1.15;
}

.skill-meta {
  font-size: var(--fs-xs);
}

.skill-rule {
  font-size: var(--fs-2xs);
  color: var(--dim);
  text-align: center;
  line-height: 1.2;
}

.matchup {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  gap: 5px 14px;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}

.matchup-head {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
  color: var(--accent-2);
  font-family: var(--font);
}

.matchup-section {
  grid-column: 1 / -1;
  margin-top: 8px;
}

.matchup-note {
  grid-column: 1 / -1;
  margin-top: 2px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  border: 1px solid color-mix(in srgb, var(--danger) 55%, transparent);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  font-size: var(--fs-xs);
  color: var(--muted);
}

/* ============ campaign ============ */
.area-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.area {
  display: flex;
  flex-direction: column;
  gap: 9px;
  overflow: hidden;
  transition: transform 0.2s var(--ease), border-color 0.2s;
}

.area:hover:not(.locked) {
  transform: translateY(-2px);
  border-color: var(--zone);
}

.area.current {
  border-color: var(--zone);
  box-shadow: 0 0 0 1px var(--zone), 0 0 28px color-mix(in srgb, var(--zone) 25%, transparent);
}

.area.locked {
  opacity: 0.45;
}

.area-banner {
  margin: -16px -16px 2px;
  height: 64px;
  padding: 10px 14px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  background: linear-gradient(135deg, color-mix(in srgb, var(--zone) 55%, #000), color-mix(in srgb, var(--zone) 15%, #000));
  border-bottom: 1px solid color-mix(in srgb, var(--zone) 40%, transparent);
}

.area-tier {
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.8;
}

.area.act-boss {
  border-color: color-mix(in srgb, var(--life-2) 45%, var(--line));
}

.area.act-boss .area-tier {
  color: var(--life-2);
}

.chip.mechanic {
  padding: 2px 8px;
  font-size: var(--fs-xs);
  cursor: help;
}

.chip.mechanic.nova { color: var(--cold); }
.chip.mechanic.summon { color: var(--currency); }
.chip.mechanic.enrage { color: var(--bad); }
.chip.mechanic.ward { color: var(--ward); }
.chip.mechanic.scorch { color: var(--fire); }
.chip.mechanic.martyrs { color: var(--accent-2); }
.chip.mechanic.channel { color: var(--light); }

.act-complete {
  border-color: var(--good);
  background: color-mix(in srgb, var(--good) 8%, var(--panel));
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}

.area-facts {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.area-facts span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ============ sidebar tabs ============ */
.feed-tabs {
  display: flex;
  gap: 2px;
  padding: 8px 8px 0;
  border-bottom: 1px solid var(--line);
}

.feed-tab {
  flex: 1;
  border: 0;
  background: transparent;
  min-height: 36px;
  padding: 7px 4px;
  margin-bottom: -1px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color var(--dur-fast);
}

.feed-tab:hover {
  color: var(--text);
}

.feed-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.feed-item.compact {
  padding: 4px 8px;
  font-size: var(--fs-xs);
}

.feed-item.loot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
}

.feed-empty {
  padding: 10px;
  font-size: var(--fs-xs);
  list-style: none;
}

@keyframes skill-flash {
  0% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 24px color-mix(in srgb, var(--accent-2) 60%, transparent); }
}

@keyframes skill-flash-b {
  0% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 24px color-mix(in srgb, var(--accent-2) 60%, transparent); }
}

@media (max-width: 1000px) {
  .arena2 {
    grid-template-columns: 1fr;
  }
  .arena2 .vs {
    display: none;
  }
  .skill-bar {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .gem-slot {
    grid-template-columns: 26px auto minmax(0, 1fr);
  }
  .gem-slot > :last-child {
    grid-column: 1 / -1;
  }
}

/* ============ tooltips: frozen, pinned, hints ============ */
.tooltip-layer.frozen .tip {
  box-shadow: 0 0 0 1px var(--accent), var(--shadow);
}

.tip-hint {
  margin-top: 6px;
  font-size: var(--fs-2xs);
  color: var(--dim);
  text-align: center;
}

.pin-dock {
  position: fixed;
  left: 244px;
  right: 292px;
  bottom: 46px;
  z-index: 90;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: fade-in 0.2s;
}

.pin-dock-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--fs-xs);
  color: var(--dim);
  pointer-events: auto;
  align-self: flex-start;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 4px 2px 12px;
}

.pin-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  overflow-x: auto;
  pointer-events: auto;
}

.pin {
  position: relative;
  flex: none;
  max-height: 44vh;
  overflow-y: auto;
  animation: tip-in 0.15s ease-out;
}

.pin .tip {
  box-shadow: 0 0 0 1px var(--line-2), var(--shadow);
}

.pin-close {
  position: absolute;
  top: 4px;
  right: 6px;
  z-index: 2;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: rgba(0, 0, 0, 0.7);
  color: var(--text);
  cursor: pointer;
  line-height: 1;
}

img.art {
  display: block;
  object-fit: cover;
}
img.art.cover {
  width: 100%;
  height: 100%;
  border-radius: inherit;
}
/* asset-pack item art: 64px painted sprites, kept whole and centred so every slot reads the same */
img.art.pack-art {
  object-fit: contain;
  filter: drop-shadow(0 2px 2px rgb(0 0 0 / 0.55));
}
/* the sprites carry their own margin, so they fill the slot rather than sitting at icon size */
.offer-art img.art.pack-art {
  width: 50px;
  height: 50px;
}
.action-art img.art.pack-art {
  width: 32px;
  height: 32px;
}
.cell img.art.pack-art {
  width: 86%;
  height: 86%;
}
/* doll slots aren't square, and a % height can't resolve inside the cell's grid, so pin the
   sprite to the cell; the belt strip is wide and short, so its sprite is cropped to the belt */
.doll-slot .cell {
  overflow: hidden;
}
.doll-slot .cell img.art.pack-art {
  position: absolute;
  inset: 0;
  margin: auto;
}
.doll-slot.slot-belt .cell img.art.pack-art {
  width: 100%;
  height: 150%;
  inset: -25% 0;
}
/* 64px pixel monsters/portraits blown up to frame size */
img.art.crisp {
  image-rendering: pixelated;
}
/* frames smaller than the sprite shrink it; smooth scaling keeps detail there */
.portrait img.art.crisp,
.crest img.art.crisp,
.quest-portrait img.art.crisp {
  image-rendering: auto;
}
/* Kibyra pixel art, only ever at whole-number scales */
img.art.pixel-art {
  display: inline-block;
  image-rendering: pixelated;
  object-fit: contain;
  vertical-align: middle;
}
/* game-icons.net silhouettes, tinted with background like the stroke icons' stroke */
.game-icon {
  display: inline-block;
  flex: none;
  vertical-align: middle;
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
}
img.art.mat-art {
  display: inline-block;
  vertical-align: middle;
  object-fit: contain;
}
.portrait,
.crest,
.station-icon,
.quest-portrait {
  overflow: hidden;
}
.arena2.has-art {
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)), var(--zone-art);
  background-size: cover;
  background-position: center;
}
.hideout-scene[style*='--scene-art'] {
  /* full-width hero at the top, fading into the stations below */
  background-color: var(--panel);
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--bg) 20%, transparent) 0, color-mix(in srgb, var(--bg) 55%, transparent) 40%, var(--panel) min(62vw, 720px)), var(--scene-art);
  background-size: 100% 100%, 100% auto;
  background-position: top center;
  background-repeat: no-repeat;
}
.hideout-scene[style*='--scene-art'] .page-head {
  min-height: clamp(140px, 22vw, 300px);
  align-items: flex-end;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}
.screen[style*='--scene-art'] {
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--bg) 35%, transparent), color-mix(in srgb, var(--bg) 90%, transparent)), var(--scene-art);
  background-size: cover;
  background-position: center;
}
.area-banner.has-art {
  background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.7)), var(--scene-art);
  background-size: cover;
  background-position: center;
  height: 96px;
}

@media (max-width: 1200px) {
  .pin-dock {
    left: 222px;
    right: 12px;
  }
}

@media (max-width: 860px) {
  .pin-dock {
    left: 12px;
  }
}

/* ============ shared text colours ============ */
.magic-text { color: var(--magic); }
.currency-text { color: var(--currency); }
.rarity-normal { color: var(--normal); }
.rarity-magic { color: var(--magic); }
.rarity-rare { color: var(--rare); }
.rarity-unique { color: var(--unique); }

.monster-rarity-magic { border-color: color-mix(in srgb, var(--magic) 65%, var(--line)) !important; }
.monster-rarity-rare { border-color: color-mix(in srgb, var(--rare) 75%, var(--line)) !important; }
.monster-rarity-unique { border-color: color-mix(in srgb, var(--unique) 80%, var(--line)) !important; }
/* a rarity glow on the battlefield token too, so magic, rare and unique stand out at a glance */
.bf-token.monster-rarity-magic:not(.targeted):not(.martyr):not(.chained) {
  border-color: color-mix(in srgb, var(--magic) 65%, var(--line));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--magic) 45%, transparent), 0 0 8px color-mix(in srgb, var(--magic) 30%, transparent);
}
.bf-token.monster-rarity-rare:not(.targeted):not(.martyr):not(.chained) {
  border-color: color-mix(in srgb, var(--rare) 75%, var(--line));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rare) 50%, transparent), 0 0 10px color-mix(in srgb, var(--rare) 35%, transparent);
}
.bf-token.monster-rarity-unique:not(.targeted):not(.martyr):not(.chained) {
  border-color: color-mix(in srgb, var(--unique) 80%, var(--line));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--unique) 55%, transparent), 0 0 12px color-mix(in srgb, var(--unique) 40%, transparent);
}
.bf-rarity-badge { font-size: 9px; font-weight: 800; flex: none; }
.monster-mod { color: var(--rare); border-color: color-mix(in srgb, var(--rare) 35%, var(--line)); }
.monster-mod-list { display: grid; gap: 3px; min-width: 0; font-size: var(--fs-sm); margin: 2px 0; }
.monster-mod-line { line-height: 1.35; }

.mod.enchant {
  color: var(--enchant);
}

.page.wide {
  max-width: 1320px;
}

/* ============ equipment ============ */
.equip-layout {
  display: grid;
  grid-template-columns: minmax(250px, 1fr) minmax(360px, 1.3fr) minmax(250px, 1fr);
  gap: var(--s-4);
  align-items: start;
}

.stat-panel .stat-sheet {
  margin: 12px 0 0;
}

/* a rule between groups of related stats */
.stat-panel .stat-sheet.grouped {
  border-top: 2px solid var(--line-2);
  padding-top: 10px;
}

.stat-group-label {
  grid-column: 1 / -1;
  font-size: var(--fs-2xs);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}

.big-stat.wide {
  text-align: center;
  padding: 12px;
}

.big-stat.wide b {
  font-size: 28px;
  font-family: var(--font);
}

.doll-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

/* helmet over body armour, a hand either side, belt with two rings each side, gloves and boots underneath */
.doll {
  --u: 56px;
  --doll-gap: 10px;
  display: grid;
  grid-template-columns: repeat(6, var(--u));
  grid-template-rows: calc(var(--u) * 1.6) calc(var(--u) * 3) var(--u) calc(var(--u) * 1.6);
  gap: 26px var(--doll-gap);
  grid-template-areas:
    '. amulet helmet helmet . .'
    'weapon weapon body body offhand offhand'
    'ring1 ring2 belt belt ring3 ring4'
    '. gloves gloves boots boots .';
  padding: 6px 0 18px;
}

.doll-slot.slot-amulet {
  align-self: center;
  justify-self: center;
  width: var(--u);
  height: var(--u);
}

/* body armour gets the full row; the hands stay their old height beside it */
.doll-slot.slot-weapon,
.doll-slot.slot-offhand {
  align-self: center;
  height: calc(var(--u) * 2.5);
}

/* the belt is a thin strip */
.doll-slot.slot-belt {
  align-self: center;
  height: calc(var(--u) * 0.62);
}

.doll-slot.slot-belt .doll-label {
  bottom: -17px;
}

.doll-slot {
  position: relative;
  display: flex;
}

.doll-slot .cell {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
}

.doll-slot .cell:not(.empty-slot) {
  border-width: 2px;
}

.doll-slot .cell.empty-slot {
  background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, 0.02) 6px 12px), var(--bg-2);
}

.doll-slot .cell.empty-slot.clickable {
  cursor: pointer;
}

.doll-slot .cell.empty-slot.clickable:hover {
  border-color: var(--accent);
}

.slot-picker {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--bg-2);
}

.slot-picker-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, 56px);
  gap: 6px;
  margin-top: 8px;
}

.slot-picker-list > span {
  display: block;
  width: 56px;
  height: 56px;
}

.slot-picker-list > .unusable {
  opacity: 0.4;
}

.doll-slot .cell svg {
  width: 32px;
  height: 32px;
}

/* the five belt flasks, as wide as the doll above them */
.doll-flasks {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  width: calc(6 * var(--u, 56px) + 5 * 10px);
  max-width: 100%;
}

.flask-amount {
  position: absolute;
  bottom: 3px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: var(--fs-2xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 1px 2px #000;
}

.flask-amount.life {
  color: var(--life-2);
}

.flask-amount.mana {
  color: var(--mana-2);
}

.doll-flasks .flask-cell {
  position: relative;
  aspect-ratio: 3 / 4;
}

.doll-flasks .cell.empty-slot {
  cursor: default;
  background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, 0.02) 6px 12px), var(--bg-2);
}

.doll-flasks .cell.empty-slot.clickable {
  cursor: pointer;
}

.doll-flasks .cell.empty-slot.clickable:hover {
  border-color: var(--accent);
}

.flask-key {
  position: absolute;
  top: 3px;
  left: 5px;
  font-size: var(--fs-2xs);
  font-variant-numeric: tabular-nums;
  color: var(--dim);
}

.flask-enchanted {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--enchant);
  box-shadow: 0 0 6px var(--enchant);
}

.doll-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -19px;
  text-align: center;
  font-size: var(--fs-2xs);
  font-weight: 500;
  color: var(--dim);
  white-space: nowrap;
  pointer-events: none;
}

.attr-strip,
.util-strip {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 18px;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.attr-strip b {
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
}

.util-strip {
  font-size: var(--fs-xs);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  width: 100%;
}

.util-strip b {
  color: var(--text);
}

.res-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-xs);
  margin-bottom: 5px;
}

.res-row .bar {
  height: 14px;
}

.bar.capped {
  box-shadow: 0 0 0 1px var(--good);
}

/* item grid: one checkered cell per inventory slot */
/* stash gear pages */
.stash-pages {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.stash-page-tab {
  min-width: 34px;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--muted);
  font: inherit;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.stash-page-tab.active {
  color: var(--text);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.stash-page-tab.buy {
  border-style: dashed;
}

.stash-page-tab:disabled {
  opacity: 0.5;
  cursor: default;
}

.stash-page-tab .aff-dot {
  font-size: var(--fs-2xs);
  color: var(--accent-2);
  margin-left: 2px;
}

.nav-switch-mobile {
  display: none;
}

/* salvage mode: rarity buttons arm on the first click, salvage on the next */
.salvage-rarity {
  border-color: color-mix(in srgb, var(--rar) 45%, var(--line));
  color: var(--rar);
}

.salvage-rarity.rar-normal {
  color: var(--text);
}

.salvage-rarity.armed {
  background: var(--danger, var(--bad));
  border-color: var(--danger, var(--bad));
  color: #fff;
}

/* item tiles: the one way gear is listed (bag, stash, ground, trader) */
.item-tile.loot-highlight {
  border-color: var(--loot-highlight);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loot-highlight) 70%, transparent), 0 0 12px color-mix(in srgb, var(--loot-highlight) 32%, transparent);
}

/* Quartermaster: layered loot filters */
.quartermaster-station { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.quartermaster-station > summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.loot-filter-manager { margin-top: 12px; min-width: 0; }
.quartermaster-auto { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.12); }
.loot-filter-tabs { margin: 14px 0 10px; }
.loot-preset-grid { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 8px; }
.loot-preset { display: grid; gap: 4px; min-height: 86px; padding: 10px; text-align: left; color: var(--text); border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.16); cursor: pointer; }
.loot-preset span { color: var(--dim); font-size: 11px; line-height: 1.35; }
.loot-preset.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.loot-overrides { display: grid; gap: 8px; }
.loot-override { display: flex; align-items: flex-start; gap: 9px; padding: 9px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; }
.loot-override span { display: grid; gap: 2px; }
.loot-override small { color: var(--dim); }
.loot-override.active { border-color: var(--accent); }
.loot-rule-list { display: grid; gap: 8px; margin: 10px 0 16px; }
.loot-rule { border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,.13); overflow: hidden; }
.loot-rule > summary { display: flex; align-items: center; gap: 8px; padding: 10px; cursor: pointer; list-style: none; }
.loot-rule > summary::-webkit-details-marker { display: none; }
.loot-rule-order { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--bg); background: var(--accent); font-weight: 800; }
.loot-rule-body { display: grid; gap: 12px; padding: 0 10px 10px; border-top: 1px solid var(--border); }
.loot-rule-body label { display: grid; gap: 4px; color: var(--dim); font-size: 11px; }
.loot-rule-body .chip { display: flex; }
.loot-condition { display: grid; gap: 7px; }
.loot-condition-grid { display: grid; grid-template-columns: repeat(3, minmax(100px, 1fr)); gap: 8px; }
.loot-rule-actions { border-top: 1px solid var(--border); padding-top: 9px; }
.loot-share { display: grid; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
.loot-share h4, .loot-share p { margin: 0; }
.loot-share textarea { width: 100%; resize: vertical; font-family: monospace; font-size: 10px; }

@media (max-width: 760px) {
  .loot-preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .loot-preset:last-child { grid-column: 1 / -1; }
  .loot-condition-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quartermaster-station .loot-filter-manager { margin-left: -4px; margin-right: -4px; }
}
.item-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
  gap: 8px;
}

/* fixed pages: a set column count that divides the page (30 → 10/6/5, 80 → 10/8/5),
   chosen by how wide the card is, so rows are always full */
.item-tiles.fixed {
  grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr));
  /* every row the height of a full tile (icon + two-line name + meta), filled or not */
  grid-auto-rows: 118px;
}

.card:has(> .item-tiles.fixed) {
  container-type: inline-size;
}

@container (min-width: 1000px) {
  .item-tiles.fixed {
    --cols: 10;
  }
}

@container (max-width: 640px) {
  .item-tiles.fixed {
    --cols: 5;
  }
}

@container (min-width: 760px) and (max-width: 999px) {
  .item-tiles.fixed.slots-80 {
    --cols: 8;
  }
}

.item-tile.empty {
  cursor: default;
  border: 1px dashed var(--line);
  box-shadow: none;
  background: color-mix(in srgb, var(--bg-2) 55%, transparent);
}

.item-tile.empty:hover {
  transform: none;
}

.item-tiles-note {
  margin-top: 8px;
  text-align: center;
}

.item-tiles-empty {
  padding: var(--s-4);
  text-align: center;
  border: 1px dashed var(--line-2);
  border-radius: var(--r);
}

.item-tile {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 4px;
  padding: 10px 8px 8px;
  min-width: 0;
  border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--rar, var(--line)) 35%, var(--line));
  box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--rar, var(--line)) 65%, transparent);
  background: radial-gradient(circle at 50% 22%, color-mix(in srgb, var(--rar, transparent) 14%, transparent), transparent 60%), var(--bg-2);
  color: var(--text);
  font: inherit;
  text-align: center;
  cursor: pointer;
  transition: transform var(--dur-fast), border-color var(--dur-fast);
}

.item-tile.rar-normal {
  border-color: var(--line);
  box-shadow: inset 0 -2px 0 var(--line-2);
}

.item-tile:hover {
  transform: translateY(-1px);
  border-color: var(--rar, var(--line-2));
}

.item-tile:focus-visible {
  box-shadow: var(--focus);
}

.item-tile.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 0 16px var(--accent-glow);
}

.item-tile.marked {
  opacity: 0.4;
}

/* gear the character can't equip yet (level or attributes): a red shade over the tile */
.item-tile.cant-equip::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: rgba(200, 30, 30, 0.15);
  pointer-events: none;
}

.item-tile-icon {
  height: 40px;
  display: grid;
  place-items: center;
}

.item-tile-name {
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.4em;
}

.item-tile-meta {
  font-size: var(--fs-xs);
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.item-tile-set {
  position: absolute;
  top: 6px;
  left: 8px;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--accent-2);
}

/* saved gear sets and skill bars */
.loadout-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.loadout-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.loadout-row .input {
  flex: 0 1 200px;
  min-width: 120px;
}

.loadout-sum {
  flex: 1 1 160px;
  min-width: 0;
}

.loadout-auto {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 6px 12px;
}

.loadout-auto label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.loadout-auto .input {
  width: 110px;
}

/* spare flasks, one tab per kind */
.flask-shelf {
  display: grid;
  gap: 10px;
}

.gem-card.static {
  cursor: default;
}

/* flask rack */
.flask-slots {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.flask-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  min-height: 72px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--bg-2);
  cursor: pointer;
  text-align: left;
  color: var(--text);
  font: inherit;
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.flask-card:hover {
  border-color: var(--line-2);
}

.flask-card.magic {
  border-color: color-mix(in srgb, var(--magic) 35%, var(--line));
}

.flask-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.flask-card.empty {
  justify-content: center;
  border-style: dashed;
  opacity: 0.6;
}

.flask-card .slot-key {
  position: absolute;
  top: 5px;
  left: 5px;
  width: 18px;
  height: 18px;
  font-size: var(--fs-2xs);
}

.flask-card-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: var(--fs-xs);
  line-height: 1.25;
}

.flask-card-text .dim {
  font-size: var(--fs-xs);
}

.enchant-tag {
  font-size: var(--fs-xs);
  color: var(--enchant);
  font-weight: 700;
}

.flask-bench {
  display: grid;
  grid-template-columns: minmax(240px, 300px) 1fr;
  gap: 16px;
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.2);
}

.flask-bench .item-tip {
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  max-width: none;
}

.flask-stash {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 8px;
}

.flask-icon {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  flex: none;
}

.flask-icon-neck {
  width: 36%;
  height: 18%;
  border-radius: 3px 3px 0 0;
  background: var(--currency);
  border: 1px solid var(--bg-2);
}

.flask-icon-body {
  position: relative;
  width: 100%;
  flex: 1;
  border-radius: 40% 40% 30% 30% / 30% 30% 22% 22%;
  border: 1px solid color-mix(in srgb, var(--flask) 50%, var(--line-2));
  background: rgba(255, 255, 255, 0.05);
  overflow: hidden;
}

.flask-icon-liquid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--flask) 80%, white 20%), color-mix(in srgb, var(--flask) 70%, black));
  transition: height 0.3s var(--ease);
}

/* flask art with the live charge level as a thin bar on its right edge */
.flask-art {
  position: relative;
  display: inline-block;
  flex: none;
}
.flask-art img.art {
  width: 100%;
  height: 100%;
}
.flask-art-meter {
  position: absolute;
  right: 0;
  top: 12%;
  bottom: 12%;
  width: max(3px, 9%);
  border-radius: 2px;
  background: rgb(0 0 0 / 0.55);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--flask) 40%, var(--line-2));
  overflow: hidden;
}
.flask-art-fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--flask) 80%, white 20%), color-mix(in srgb, var(--flask) 70%, black));
  transition: height 0.3s var(--ease);
}

.flask.magic {
  border-color: color-mix(in srgb, var(--magic) 50%, var(--line-2));
}

/* ============ stash ============ */
.stash-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* all Stash tabs share one grid cell: the body keeps the tallest tab's height */
.stash-views {
  display: grid;
}

.stash-view {
  grid-area: 1 / 1;
  min-width: 0;
  display: grid;
}

.stash-view.off {
  visibility: hidden;
  pointer-events: none;
}

.currency-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.currency-slot {
  position: relative;
  width: 96px;
  height: 104px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--orb) 16%, transparent), transparent 65%), var(--bg-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: border-color 0.15s, transform 0.15s;
}

.currency-slot:hover {
  border-color: var(--orb);
  transform: translateY(-2px);
}

.currency-slot.none {
  opacity: 0.4;
}

.currency-count {
  position: absolute;
  top: 6px;
  right: 8px;
  font-weight: 800;
  font-size: var(--fs-md);
  text-shadow: 0 1px 2px #000;
}

.currency-name {
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
}

.material-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
}

.material-tile {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--bg-2);
}

.material-tile .swatch {
  justify-self: center;
}

.material-tile.none {
  opacity: 0.4;
}

.material-tile b {
  font-size: var(--fs-md);
}

.material-name {
  font-size: var(--fs-sm);
}

.material-tile.sell {
  grid-template-columns: 34px 1fr auto;
}

/* ============ Uniques tab: a spot for every unique ============ */
.unique-shelf {
  margin-bottom: var(--s-4);
}

.unique-spot {
  position: relative;
  display: grid;
}

.unique-spot-count {
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--unique);
  pointer-events: none;
}

/* a unique not in the tab: greyed out, with where it drops on hover */
.item-tile.unique-spot-missing {
  cursor: default;
  opacity: 0.4;
  filter: grayscale(0.85);
}

.item-tile.unique-spot-missing:hover {
  transform: none;
  opacity: 0.6;
}

/* ============ NPC panel (Trader's Stall) ============ */
.npc-panel {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: var(--s-4) var(--s-5);
  align-items: center;
  padding: var(--s-4) var(--s-5) var(--s-4) var(--s-4);
  overflow: hidden;
  background: radial-gradient(420px 220px at 0% 50%, var(--accent-soft), transparent 70%), var(--panel);
}

.npc-portrait {
  width: 136px;
  height: 136px;
  border-radius: var(--r-lg);
  overflow: hidden;
  display: grid;
  place-items: center;
  border: 1px solid var(--accent-line);
  background: radial-gradient(circle at 50% 30%, var(--panel-2), var(--bg-2));
}

.npc-portrait .portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 22%;
}

.npc-text h1 {
  font-size: var(--fs-xl);
}

.npc-quote {
  margin: 8px 0 0;
  padding-left: var(--s-3);
  border-left: 2px solid var(--accent-line);
  font-style: italic;
  color: var(--muted);
  max-width: 60ch;
}

.npc-aside {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.npc-aside .label {
  font-size: var(--fs-xs);
  color: var(--dim);
}

.gold-amount {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-2);
  font-variant-numeric: tabular-nums;
}

.shop-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2) var(--s-3);
}

/* ============ the stall: striped awning, stock on wooden shelves, hanging price tags ============ */
.npc-panel.shopfront {
  position: relative;
  padding-top: calc(var(--s-4) + 34px);
  border-bottom: 3px solid var(--wood-dark);
}

/* a scalloped canvas awning along the top of the stall */
.awning {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 30px;
  background: repeating-linear-gradient(90deg, var(--awning-a) 0 40px, var(--awning-b) 40px 80px);
  -webkit-mask: radial-gradient(circle 11px at 20px 100%, transparent 98%, #000) 0 0 / 40px 100% repeat-x;
  mask: radial-gradient(circle 11px at 20px 100%, transparent 98%, #000) 0 0 / 40px 100% repeat-x;
  box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.3);
  opacity: 0.85;
}

.stall {
  display: grid;
  /* shelves side by side on wide screens: a shop holds only a few wares per shelf */
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
  align-items: start;
  gap: var(--s-5);
  padding: var(--s-4) var(--s-5) var(--s-5);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--wood) 14%, var(--panel)), color-mix(in srgb, var(--wood-dark) 22%, var(--bg)));
}

.shelf {
  display: grid;
  gap: 10px;
}

/* a small brass plaque naming the shelf */
.shelf-label {
  justify-self: start;
  padding: 3px 12px;
  border-radius: var(--r-sm);
  border: 1px solid color-mix(in srgb, var(--currency) 50%, transparent);
  background: linear-gradient(180deg, color-mix(in srgb, var(--currency) 22%, var(--panel-2)), color-mix(in srgb, var(--currency) 8%, var(--bg-2)));
  color: var(--currency);
  font-family: var(--font);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* the goods stand on a plank */
.shelf-goods {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr));
  gap: var(--s-3);
  padding-bottom: 16px;
}

.shelf-goods::after {
  content: '';
  position: absolute;
  left: -10px;
  right: -10px;
  bottom: 0;
  height: 12px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--wood) 0 30%, var(--wood-dark) 100%);
  box-shadow: 0 6px 10px rgba(0, 0, 0, 0.45);
}

.offer-card {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: start;
  gap: 8px;
  padding: 14px 10px 10px;
  border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--rar, var(--line)) 30%, var(--line));
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--rar, transparent) 14%, transparent), transparent 62%), var(--panel);
  text-align: center;
  transition: transform var(--dur) var(--ease), border-color var(--dur);
}

.offer-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--rar, var(--line-2)) 55%, var(--line-2));
}

.offer-art {
  width: 72px;
  height: 72px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rar, transparent) 20%, var(--bg-2)), var(--bg) 75%);
  border: 1px solid color-mix(in srgb, var(--rar, var(--line)) 35%, var(--line));
}

.offer-icon {
  display: grid;
  place-items: center;
}

.offer-text {
  display: grid;
  gap: 2px;
  min-width: 0;
  font-size: var(--fs-sm);
  line-height: 1.3;
}

.offer-text b {
  font-weight: 600;
}

.offer-kind {
  font-size: var(--fs-xs);
  color: var(--dim);
}

/* a parchment tag on a string */
.price-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  padding: 3px 10px 3px 16px;
  border-radius: 3px 6px 6px 3px;
  clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%);
  background: linear-gradient(180deg, #e8d9b0, #cdb98a);
  color: #3a2a14;
  font-weight: 800;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}

.price-tag::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 50%;
  width: 4px;
  height: 4px;
  margin-top: -2px;
  border-radius: 50%;
  background: #3a2a14;
}

.price-tag.short {
  color: #7a1d14;
}

.offer-card .btn {
  width: 100%;
  justify-content: center;
}

.price {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
  color: var(--accent-2);
}

.offer-card.poor .offer-art,
.offer-card.poor .offer-text {
  opacity: 0.6;
}

.rar-currency { --rar: var(--currency); }
.rar-gem { --rar: var(--magic); }


@container (max-width: 960px) {
  .equip-layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .equip-layout .doll-card {
    grid-column: 1 / -1;
    order: -1;
  }
}

@container (max-width: 600px) {
  .equip-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 1100px) {
  .flask-slots {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .flask-bench {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {
  .doll {
    --u: 46px;
    --doll-gap: 6px;
  }
  .doll-flasks {
    width: calc(6 * 46px + 5 * 6px);
  }
  .npc-panel {
    grid-template-columns: 80px minmax(0, 1fr);
    padding: var(--s-4);
  }
  .npc-portrait {
    width: 80px;
    height: 80px;
  }
  .npc-aside {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

/* ============ animations ============ */
@keyframes page-in {
  from { opacity: 0; transform: translateY(6px); }
}

@keyframes feed-in {
  from { opacity: 0; transform: translateX(10px); }
}

@keyframes tip-in {
  from { opacity: 0; transform: translateY(4px); }
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(14px) scale(0.96); }
}

@keyframes fade-in {
  from { opacity: 0; }
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
}

@keyframes pulse {
  50% { opacity: 0.45; }
}

@keyframes bob {
  50% { transform: translateY(-3px) rotate(-4deg); }
}

@keyframes float-up {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-26px); }
}

@keyframes dmg-float {
  0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
  15% { opacity: 1; transform: translate(-50%, -8px) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
}

@keyframes shake {
  25% { transform: translateX(-4px) rotate(-1deg); }
  50% { transform: translateX(4px) rotate(1deg); }
  75% { transform: translateX(-2px); }
}

@keyframes shake2 {
  25% { transform: translateX(-4px) rotate(-1deg); }
  50% { transform: translateX(4px) rotate(1deg); }
  75% { transform: translateX(-2px); }
}

@keyframes crit-flash {
  0% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 40px color-mix(in srgb, var(--accent-2) 60%, transparent); }
}

@keyframes crit-flash2 {
  0% { box-shadow: 0 0 0 2px var(--accent-2), 0 0 40px color-mix(in srgb, var(--accent-2) 60%, transparent); }
}

@keyframes glow {
  50% { box-shadow: 0 0 18px color-mix(in srgb, var(--station) 30%, transparent); }
}

@keyframes ember-rise {
  0% { opacity: 0; transform: translate(0, 0); }
  10% { opacity: 0.9; }
  100% { opacity: 0; transform: translate(var(--drift, 20px), -340px); }
}

@keyframes flask-active {
  50% { box-shadow: 0 0 22px color-mix(in srgb, var(--flask) 70%, transparent); }
}

@keyframes beam-rare {
  0% { background: color-mix(in srgb, var(--rare) 35%, var(--bg-2)); }
}

@keyframes beam-unique {
  0% { background: color-mix(in srgb, var(--unique) 45%, var(--bg-2)); box-shadow: inset 3px 0 0 var(--unique), 0 0 24px var(--unique); }
}

@keyframes shimmer {
  0% { filter: brightness(1.8) saturate(1.4); transform: scale(1.02); }
}

@keyframes dash {
  to { stroke-dashoffset: -14; }
}

.reduced-motion *,
.reduced-motion *::before,
.reduced-motion *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ============ responsive ============ */
@media (max-width: 1440px) {
  .app {
    grid-template-columns: 220px minmax(0, 1fr) 260px;
  }
  .char-plate-body {
    width: 220px;
  }
}

@media (max-height: 760px) and (min-width: 861px) {
  .app {
    grid-template-rows: 56px minmax(0, 1fr) 34px;
  }
  .topbar {
    padding: 0 var(--s-4);
  }
  .main {
    padding: var(--s-3) var(--s-4);
  }
  .page {
    gap: var(--s-3);
  }
}

@media (max-width: 1280px) {
  .app {
    grid-template-columns: 210px minmax(0, 1fr);
    grid-template-areas:
      'side top'
      'side main'
      'xp xp';
  }
  .feed {
    display: none;
  }
  .skill-hero {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .skill-hero .xp {
    grid-column: 1 / -1;
  }
}

@media (max-width: 860px) {
  /* Scroll the whole phone layout so navigation and character bars leave the
     screen with the page instead of permanently crowding the content. */
  html,
  body,
  #root {
    overflow: hidden;
    overscroll-behavior: none;
  }

  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    max-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
    padding-bottom: 40px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto 1fr;
    grid-template-areas: 'top' 'side' 'main';
  }
