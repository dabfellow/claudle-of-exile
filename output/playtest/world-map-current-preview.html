  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 2px solid #5b5142;
  background: radial-gradient(circle at 35% 30%, #3a352c, #141210);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  color: var(--dim);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: transform var(--dur-fast), border-color var(--dur-fast);
}

.md-orb:hover {
  transform: scale(1.1);
  border-color: var(--accent);
}

.md-orb.o0 {
  left: 2%;
  top: 2%;
}

.md-orb.o1 {
  right: 2%;
  top: 2%;
}

.md-orb.o2 {
  right: 2%;
  bottom: 2%;
}

.md-orb.o3 {
  left: 2%;
  bottom: 2%;
}

.md-orb.locked {
  opacity: 0.5;
}

.md-orb.active {
  --orb: #6f93e0;
  color: #fff;
  border-color: var(--orb);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--orb) 70%, #fff), color-mix(in srgb, var(--orb) 60%, #000));
  box-shadow: 0 0 14px color-mix(in srgb, var(--orb) 70%, transparent);
}

.md-orb.active.journeyman {
  --orb: #d9b45a;
}

.md-orb.active.master {
  --orb: #b06ad0;
}

.md-orb.selected {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
}

.md-orb-empty {
  font-size: 18px;
  line-height: 1;
}

.md-slot-panel {
  width: 100%;
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
}

.md-slot-panel .grow {
  flex: 1;
}

/* what's loaded */
.md-info {
  display: grid;
  gap: 10px;
  align-content: start;
}

.md-kicker {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--portal) 85%, #fff);
}

.md-title {
  margin: -6px 0 0;
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.1;
}

.md-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.md-fact {
  display: grid;
  gap: 1px;
  min-width: 78px;
  padding: 5px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg-2) 85%, transparent);
  line-height: 1.2;
}

.md-fact small {
  font-size: var(--fs-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
}

.md-fact b {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
}

.md-fact.bad b {
  color: var(--bad);
}

.md-fact.good b {
  color: var(--good);
}

.md-desc {
  margin: 0;
}

.md-flavour {
  font-style: italic;
}

.md-marks {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: var(--fs-xs);
  color: var(--dim);
}

.md-mark.on {
  color: var(--good);
}

.md-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 2px;
}

.md-actions .btn.md-open {
  min-width: 160px;
  box-shadow: 0 0 18px color-mix(in srgb, var(--portal) 35%, transparent);
}

.md-packs {
  display: grid;
  gap: 4px;
}

.md-packs-bar {
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--line);
}

.md-packs-bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, color-mix(in srgb, var(--portal) 60%, #000), var(--portal));
  transition: width 0.4s;
}

.md-mods {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.md-mod {
  padding: 2px 8px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  font-size: var(--fs-xs);
  cursor: help;
}

.md-mod.sextant {
  border-color: color-mix(in srgb, #6f93e0 60%, var(--line));
}

.md-mod.doomed {
  border-color: color-mix(in srgb, var(--danger) 70%, var(--line));
  color: var(--bad);
}

.md-mod.rolled {
  border-color: color-mix(in srgb, var(--warn) 60%, var(--line));
}

.md-more > summary {
  cursor: pointer;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.md-more[open] > summary {
  margin-bottom: 6px;
}

.md-more p {
  margin: 4px 0;
}

/* a map picked while a portal is open, waiting its turn */
.md-next {
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px dashed var(--line-2);
  background: color-mix(in srgb, var(--bg-2) 70%, transparent);
}

.md-next-label {
  font-size: var(--fs-2xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
}

.md-next .md-title {
  font-size: 20px;
}

/* the Sextants you hold, under the loaded map */
.md-astro {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding-top: var(--s-3);
  border-top: 1px solid var(--line);
  font-size: var(--fs-sm);
}

.md-astro-title {
  font-weight: 600;
}

.md-astro-stock {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.md-astro-help {
  flex: 1 1 100%;
}

/* tabs */
.md-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}

.md-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}

.md-tab:hover {
  color: var(--text);
}

.md-tab.active {
  color: var(--accent-2);
  border-bottom-color: var(--accent);
}

/* maps as portal cards */
.md-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: var(--s-3);
}

.md-card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  min-height: 168px;
  padding: 0;
  overflow: hidden;
  border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--portal) 40%, var(--line));
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--portal) 30%, transparent), transparent 60%), #121214;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform var(--dur-fast), box-shadow var(--dur-fast), border-color var(--dur-fast);
}

.md-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 16px color-mix(in srgb, var(--portal) 30%, transparent);
}

.md-card.selected {
  border-color: var(--portal);
  box-shadow: 0 0 0 1px var(--portal), 0 0 22px color-mix(in srgb, var(--portal) 45%, transparent);
}

.md-card-art {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, transparent 25%, rgba(8, 8, 10, 0.92) 78%),
    radial-gradient(ellipse at 50% 35%, transparent 30%, rgba(0, 0, 0, 0.55) 75%),
    var(--art, none) center / cover;
  filter: saturate(0.85) brightness(0.8);
  transition: filter var(--dur);
}

.md-card:hover .md-card-art,
.md-card.selected .md-card-art {
  filter: saturate(1.05) brightness(1);
}

.md-card.empty .md-card-art {
  filter: grayscale(0.85) brightness(0.55);
}

.md-card.empty .md-card-mark {
  opacity: 0.5;
}

.md-card-mark {
  position: absolute;
  top: 8px;
  left: 12px;
  font-family: var(--font-display);
  font-size: 34px;
  line-height: 1;
  color: color-mix(in srgb, var(--portal) 85%, #fff);
  text-shadow: 0 0 10px color-mix(in srgb, var(--portal) 70%, transparent), 0 2px 4px #000;
}

.md-card-held {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 1px 8px;
  border-radius: var(--r-pill);
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--line-2);
  font-size: var(--fs-xs);
  font-weight: 700;
}

.md-card.empty .md-card-held {
  color: var(--dim);
}

.md-card-body {
  position: relative;
  display: grid;
  gap: 3px;
  padding: 10px 12px 12px;
}

.md-card-title {
  font-size: var(--fs-sm);
  line-height: 1.2;
}

.md-card-sub {
  font-size: var(--fs-2xs);
  color: var(--muted);
}

.md-card-mod {
  justify-self: start;
  padding: 0 7px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: rgba(0, 0, 0, 0.5);
  font-size: var(--fs-2xs);
  color: var(--muted);
}

.md-card-mod.warn {
  border-color: color-mix(in srgb, var(--warn) 60%, var(--line));
  color: var(--warn);
}

.md-card-mod.good {
  border-color: color-mix(in srgb, var(--success) 60%, var(--line));
  color: var(--good);
}

.md-card-pips {
  display: flex;
  gap: 4px;
}

.md-card-pips i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
}

.md-card-pips i.on {
  border-color: var(--good);
  background: var(--good);
}

.md-card.running {
  border-color: var(--success);
  animation: md-running 2s ease-in-out infinite;
}

@keyframes md-running {
  50% {
    box-shadow: 0 0 18px color-mix(in srgb, var(--success) 55%, transparent);
  }
}

.md-card-running {
  position: absolute;
  top: 44px;
  left: 0;
  padding: 1px 10px;
  border-radius: 0 var(--r-pill) var(--r-pill) 0;
  background: var(--success);
  color: #0b0d10;
  font-size: var(--fs-2xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.md-section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: var(--s-2);
}

.md-section-head h3 {
  margin: 0;
}

/* modifier safety: folded to one summary line */
.md-safety > summary {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  cursor: pointer;
}

.md-safety-sum {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.md-avoid.blocked {
  border-color: var(--danger);
  background: var(--danger-soft);
  color: var(--bad);
}

/* run totals */
.md-totals {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 20px;
  padding: 12px 16px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: var(--fs-sm);
}

.md-totals-note {
  flex: 1 1 260px;
  text-align: right;
}

@container (max-width: 760px) {
  .card.md-stage {
    grid-template-columns: minmax(0, 1fr);
    padding: var(--s-4);
    gap: var(--s-4);
    background:
      radial-gradient(320px 260px at 50% 140px, color-mix(in srgb, var(--portal) 18%, transparent), transparent 70%),
      var(--panel);
  }
  .md-device {
    width: min(250px, 70vw);
  }
  .md-title {
    font-size: 22px;
  }
  .md-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--s-2);
  }
  .md-card {
    min-height: 140px;
  }
  .md-card-mark {
    font-size: 28px;
  }
  .md-totals-note {
    text-align: left;
  }
  .md-tab {
    padding: 10px 10px;
  }
}

/* ============ Cartography: the map case ============ */
.mc-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 8px;
}

.mc-tile {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 10px;
  align-items: center;
  min-height: 62px;
  padding: 8px 10px;
  overflow: hidden;
  border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--portal) 40%, var(--line));
  background:
    linear-gradient(90deg, rgba(10, 10, 12, 0.92) 30%, rgba(10, 10, 12, 0.6)),
    var(--art, none) center / cover,
    var(--bg-2);
}

.mc-tile.empty {
  filter: grayscale(0.8);
  opacity: 0.65;
}

.mc-tile-mark {
  grid-row: span 2;
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1;
  color: color-mix(in srgb, var(--portal) 85%, #fff);
  text-shadow: 0 0 8px color-mix(in srgb, var(--portal) 60%, transparent);
}

.mc-tile-count {
  font-size: var(--fs-md);
  font-weight: 700;
}

.mc-tile-name {
  font-size: var(--fs-2xs);
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mc-sextants {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: var(--fs-sm);
}

.mc-sextants span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

@media (prefers-reduced-motion: reduce) {
  .md-runes,
  .md-portal-swirl,
  .md-device.open .md-portal,
  .md-card.running,
  .hl-now-icon {
    animation: none;
  }
}
.bf-auto.locked { opacity: 0.5; }

.veyrath-atlas { display: grid; gap: 10px; }
.veyrath-atlas-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.veyrath-atlas-toolbar h2, .veyrath-atlas-toolbar p { margin: 0; }
.veyrath-atlas-toolbar p { margin-top: 5px; }
.veyrath-atlas .cmap-world { min-width: 0; }
.veyrath-atlas .cmap-card { max-width: none; margin: 0; padding: 0; overflow: hidden; }
.veyrath-frontiers { pointer-events: none; }
.veyrath-frontiers path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.veyrath-frontiers .frontier-ink { stroke: #69513b; stroke-width: 1.15; stroke-dasharray: 3.2 2.3 .65 2.3; stroke-opacity: .8; transition: stroke-width 120ms ease, stroke-opacity 120ms ease; }
.veyrath-frontiers .is-current .frontier-ink { stroke: #493826; stroke-width: 1.7; stroke-opacity: 1; }
.veyrath-territory { pointer-events: all; cursor: pointer; fill: transparent; stroke: none; outline: none; }
.veyrath-territory.is-locked { cursor: default; }
.veyrath-ribbon { position: absolute; z-index: 2; width: max-content; min-width: 118px; height: 40px; padding: 0 18px 14px; box-sizing: border-box; border: 0; background: none; color: #483620; cursor: pointer; transform: translate(-50%, -50%) rotate(var(--ribbon-turn)); text-align: center; -webkit-tap-highlight-color: transparent; }
.veyrath-ribbon > small { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); padding: 0; white-space: nowrap; background: none; border: 0; color: #62513e; font: 400 10px/12px Georgia, 'Times New Roman', serif; letter-spacing: .04em; }
.veyrath-ribbon-paper { position: absolute; inset: 0 0 auto; width: 100%; height: 28px; overflow: visible; filter: none; }
.veyrath-ribbon-paper path { stroke: #786044; stroke-width: .85; stroke-linecap: round; stroke-linejoin: round; }
.ribbon-tails { fill: #cdbd99; fill-opacity: .55; stroke-opacity: .55; }
.ribbon-face { fill: #eadcba; fill-opacity: .7; stroke-opacity: .65; }
.veyrath-ribbon-paper .ribbon-folds { fill: none; stroke: #9a805a; stroke-width: .65; stroke-opacity: .5; }
.veyrath-ribbon-name { position: relative; display: block; white-space: nowrap; font: italic 500 12px/24px Georgia, 'Times New Roman', serif; }
.veyrath-ribbon:hover .ribbon-face, .veyrath-ribbon:focus-visible .ribbon-face { fill: #f3e6c5; fill-opacity: .9; stroke: #4e3921; stroke-opacity: .85; stroke-width: 1.1; }
.veyrath-ribbon:focus-visible { outline: none; box-shadow: none; }
.veyrath-ribbon:disabled { cursor: default; opacity: .6; }
.veyrath-ribbon, .veyrath-ribbon > small, .veyrath-ribbon-name { text-shadow: none; filter: none; }
.cmap-act .cmap-node:not(.selected):not(:hover):not(:focus-visible) .cmap-node-name { opacity: 0; pointer-events: none; }
.cmap-act .cmap-node-name { transition: opacity 120ms ease; }
.cmap-act .cmap-node .cmap-node-name { color: #62513e; background: none; border: 0; font: italic 400 13px/1.08 Georgia, 'Times New Roman', serif; letter-spacing: .01em; text-shadow: none; filter: none; box-shadow: none; }
@media (max-width: 600px) {
  .veyrath-atlas-toolbar { align-items: flex-start; }
  .veyrath-atlas-toolbar p { max-width: 24ch; }
  .veyrath-atlas .cmap-world { min-width: 800px; }
  .veyrath-atlas .cmap-world-scroll { overflow-x: auto; }
