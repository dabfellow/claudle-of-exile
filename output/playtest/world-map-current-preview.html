  /* The title, account, character select and create screens sit outside
     .app, so with the page locked above they need their own scroll area. */
  html .screen {
    position: fixed;
    inset: 0;
    height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .sidebar {
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
    flex: none;
    min-height: 0;
    z-index: 6;
  }
  .brand,
  .nav-label,
  .char-foot {
    display: none;
  }
  .nav-group,
  .sidebar-foot {
    display: flex;
    padding: 6px 2px;
    margin: 0;
    border: 0;
  }
  .nav-group + .nav-group,
  .sidebar-foot {
    border-left: 1px solid var(--line);
  }
  .nav-item {
    width: auto;
    min-height: 64px;
    padding: 4px 8px;
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    align-content: start;
    gap: 4px;
    text-align: center;
  }
  .nav-name {
    display: block;
    font-size: var(--fs-2xs);
    line-height: 1.15;
    font-weight: 600;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    max-width: 74px;
  }
  .nav-item.active::before {
    left: 8px;
    right: 8px;
    top: auto;
    bottom: 0;
    width: auto;
    height: 3px;
  }
  .nav-badge:not(.hot) {
    display: none;
  }
  .nav-badge.hot {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 0;
    padding: 0 5px;
    line-height: 16px;
    font-size: var(--fs-2xs);
  }
  .topbar {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--s-2) var(--s-3);
    padding: 8px 12px;
    height: auto;
  }
  .activity {
    display: none;
  }
  .char-plate-body {
    width: auto;
    min-width: 160px;
  }
  .main {
    padding: var(--s-4) var(--s-3);
    min-height: 0;
    overflow: visible;
  }
  .xpbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
  }
  .page {
    gap: var(--s-4);
  }
  .page-head h1,
  .skill-hero h1,
  .npc-text h1 {
    font-size: 24px;
  }
  .arena {
    grid-template-columns: 1fr;
  }
  .vs {
    display: none;
  }
  .bench-layout {
    grid-template-columns: 1fr;
  }
  .currency-strip {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: flex-end;
  }
  .currency-strip .chip .dim {
    display: none;
  }
  .currency-strip .chip:nth-child(n+3) {
    display: none;
  }
  .nav-switch-mobile {
    display: grid;
  }
  .hideout-scene {
    padding: var(--s-4);
  }
  .xp-label {
    font-size: var(--fs-2xs);
  }
}

@media (max-width: 480px) {
  .card:not(.station) {
    padding: var(--s-3);
  }
  .skill-hero-icon {
    width: 48px;
    height: 48px;
  }
  .tab,
  .stash-tab {
    padding: 6px 10px;
  }
  /* the floating quest keeps its title and objective; the dialogue line would cover the page */
  .quest.floating .quest-npc {
    display: none;
  }
}

/* ============ passive trees (v2 & 5x overhaul) ============ */
.tree-wrap {
  height: min(74vh, 820px);
}

/* --- Top Bar & Profile Manager --- */
.tree-top-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.tree-profile-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.tree-profile-tabs {
  display: inline-flex;
  align-items: center;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 3px;
}

.tree-profile-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  font-size: var(--fs-sm);
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: var(--r-xs);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}

.tree-profile-tab:hover:not(.locked) {
  color: var(--text);
  background: var(--panel);
}

.tree-profile-tab.active {
  color: var(--accent-2);
  background: var(--panel);
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
}

.tree-profile-tab.locked {
  opacity: 0.55;
  cursor: not-allowed;
}

.tree-lock-icon {
  font-size: 11px;
  opacity: 0.85;
}

.tree-settings-btn {
  padding: 5px 10px;
  font-size: var(--fs-xs);
}

.linked-badge {
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.4);
  color: #70f8ff;
  font-size: var(--fs-xs);
  padding: 4px 10px;
  border-radius: 999px;
  transition: all 0.15s ease;
}

.linked-badge:hover {
  background: rgba(0, 240, 255, 0.15);
  border-color: #00f0ff;
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
}

.linked-badge-empty {
  border: 1px dashed var(--line-2);
  color: var(--dim);
  font-size: var(--fs-xs);
  padding: 4px 10px;
  border-radius: 999px;
  transition: all 0.15s ease;
}

.linked-badge-empty:hover {
  border-color: var(--accent);
  color: var(--text);
}

/* --- Currency Bar & Point Trackers --- */
.tree-currency-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-point-cyan {
  background: rgba(0, 210, 224, 0.12);
  border: 1px solid #00d2e0;
  color: #00f0ff;
  font-weight: 600;
  font-size: var(--fs-sm);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
}

.chip-point-gold {
  background: rgba(229, 184, 92, 0.12);
  border: 1px solid #e5b85c;
  color: #ffd700;
  font-weight: 600;
  font-size: var(--fs-sm);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.35);
}

.chip-point-purple {
  background: rgba(171, 104, 255, 0.12);
  border: 1px solid #ab68ff;
  color: #c084fc;
  font-weight: 600;
  font-size: var(--fs-sm);
  padding: 4px 10px;
  border-radius: var(--r-sm);
  text-shadow: 0 0 8px rgba(171, 104, 255, 0.35);
}

.chip-regret {
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  color: var(--text);
  font-size: var(--fs-sm);
  padding: 4px 10px;
  border-radius: var(--r-sm);
}

.btn-refund-toggle {
  transition: all 0.2s ease;
}

.btn-refund-toggle.active {
  background: #d93848 !important;
  border-color: #ff5264 !important;
  color: #ffffff !important;
  box-shadow: 0 0 10px rgba(217, 56, 72, 0.6) !important;
}

/* --- Search & Matching Nodes Highlight --- */
.tree-node.match {
  filter: drop-shadow(0 0 12px rgba(255, 220, 60, 0.95)) drop-shadow(0 0 24px rgba(255, 200, 30, 0.65)) !important;
}

.tree-node.match circle.body,
.tree-node.match polygon.body,
.tree-node.match rect.body,
.tree-node.match .gateway-bg,
.tree-node.match .doomed-diamond,
.tree-node.match .celestial-star-outer,
.tree-node.match .mastery-hex-outer {
  stroke: #ffe066 !important;
  stroke-width: 4.5px !important;
}

.tree-search {
  min-width: 260px;
}

.tree-name {
  font-family: Cinzel, serif;
  paint-order: stroke;
  stroke: var(--bg-2);
  pointer-events: none;
  font-weight: 600;
}

/* --- Cosmic Gateways --- */
.gateway-node {
  cursor: pointer;
}

.gateway-node circle.gateway-pulse-outer,
.gateway-node circle.gateway-pulse-inner {
  display: none;
}

.gateway-node circle.gateway-bg {
  fill: #031525;
  stroke: #00f0ff;
  stroke-width: 2.5;
}

.gateway-node circle.gateway-ring {
  fill: none;
  stroke: #00f0ff;
  stroke-width: 2;
  stroke-dasharray: 6 4;
}

.gateway-node circle.gateway-inner-ring {
  fill: none;
  stroke: #70f8ff;
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
}

.gateway-node circle.gateway-core {
  fill: #00f0ff;
}

.gateway-node circle.gateway-dot {
  fill: #ffffff;
}

.gateway-node.on circle.gateway-bg {
  fill: #052a42;
  stroke: #38f9d7;
}

.gateway-tip {
  border-color: rgba(0, 240, 255, 0.4) !important;
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
}

.gateway-conduit-box {
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  margin: 8px 0;
}

.gateway-dest-label {
  font-size: var(--fs-xs);
  color: var(--muted);
}

.gateway-dest-name {
  font-size: var(--fs-md);
  font-weight: 700;
  color: #00f0ff;
  margin-top: 2px;
}

.conduit-prompt {
  color: #00f0ff !important;
}

/* --- Doomed Gates --- */
.doomed-node {
  cursor: pointer;
}

.doomed-node polygon.doomed-aura {
  display: none;
}

.doomed-node polygon.doomed-diamond {
  fill: #1c0508;
  stroke: #e6203a;
  stroke-width: 2.5;
}

.doomed-node.on polygon.doomed-diamond {
  fill: #3b0910;
  stroke: #ff3b56;
}

.doomed-node polygon.doomed-inner-diamond {
  fill: #2c080d;
  stroke: #a01525;
  stroke-width: 1.5;
}

.doomed-node path.doomed-skull {
  fill: #ff6b81;
}

.doomed-warning-badge rect {
  fill: #240508;
  stroke: #ff3b56;
  stroke-width: 1.2;
}

.doomed-warning-badge text {
  fill: #ff8597;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.5px;
  pointer-events: none;
}

.doomed-tip {
  border-color: rgba(255, 42, 75, 0.4) !important;
}

.doomed-warning-box {
  background: rgba(255, 30, 60, 0.1);
  border: 1px solid #ff3b56;
  border-radius: var(--r-sm);
  padding: 8px 10px;
  margin: 8px 0;
}

.doomed-warning-title {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: #ff6b81;
  letter-spacing: 0.5px;
}

.doomed-warning-text {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #ff99aa;
  margin-top: 2px;
}

/* --- Celestial Forbidden Keystones --- */
.celestial-star-node {
  cursor: pointer;
}

.celestial-star-node circle.celestial-halo,
.celestial-star-node circle.celestial-inner-halo {
  display: none;
}

.celestial-star-node polygon.celestial-star-outer {
  fill: #1f0815;
  stroke: #ff2d8d;
  stroke-width: 2.5;
}

.celestial-star-node.on polygon.celestial-star-outer {
  fill: #3a0d27;
  stroke: #ff66b2;
}

.celestial-star-node polygon.celestial-star-inner {
  fill: #3b0925;
  stroke: #ff85c8;
  stroke-width: 1.5;
}

.celestial-star-node circle.celestial-core {
  fill: #ff3d9a;
}

.celestial-star-node circle.celestial-spark {
  fill: #ffffff;
}

.celestial-tip {
  border-color: rgba(255, 61, 154, 0.4) !important;
  box-shadow: 0 0 16px rgba(255, 61, 154, 0.2);
}

.celestial-desc {
  color: #ff85c8;
  font-weight: 500;
}

/* --- Mastery Sockets --- */
.mastery-socket-node {
  cursor: pointer;
}

.mastery-socket-node circle.mastery-halo {
  fill: none;
  stroke: #a855f7;
  stroke-width: 2;
  opacity: 0;
  filter: blur(2px);
  transition: opacity 0.3s;
}

.mastery-socket-node polygon.mastery-hex-outer {
  fill: #14161d;
  stroke: #a855f7;
  stroke-width: 2.5;
  transition: fill 0.2s, stroke 0.2s;
}

.mastery-socket-node.on polygon.mastery-hex-outer {
  fill: #2d124d;
  stroke: #c084fc;
  filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.8));
}

.mastery-socket-node.on circle.mastery-halo {
  opacity: 0.8;
}

.mastery-socket-node.can polygon.mastery-hex-outer {
  stroke: #e9d5ff;
}

.mastery-socket-node polygon.mastery-hex-inner {
  fill: none;
  stroke: #7e22ce;
  stroke-width: 1.2;
}

.mastery-socket-node polygon.mastery-gem {
  fill: #a855f7;
}

.mastery-socket-node.on polygon.mastery-gem {
  fill: #e9d5ff;
  filter: drop-shadow(0 0 6px #c084fc);
}

/* --- Gateway / Doomed / Celestial Overhaul: hardware acceleration --- */
.gateway-node circle.gateway-ring,
.gateway-node circle.gateway-inner-ring,
.celestial-star-node circle.celestial-halo,
.celestial-star-node circle.celestial-inner-halo,
.doomed-node polygon.doomed-aura {
  will-change: transform;
}

/* Keyframes */
@keyframes gatewayPulse {
  0% {
    r: 16px;
    opacity: 0.9;
  }
  100% {
    r: 36px;
    opacity: 0;
  }
}

@keyframes gatewaySpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes gatewaySpinReverse {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(-360deg);
  }
}

@keyframes doomedAura {
  0% {
    transform: scale(0.95);
    opacity: 0.5;
  }
  100% {
    transform: scale(1.12);
    opacity: 0.9;
  }
}

@keyframes celestialSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.tree-key {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.tree-key span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tree-totals {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 4px 16px;
  font-size: var(--fs-sm);
}

.mastery-tip .mod.chosen {
  color: var(--accent-2);
}

.mastery-option {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 12px 14px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.mastery-option:hover:not(:disabled) {
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}

.mastery-option.chosen {
  border-color: var(--accent);
  color: var(--accent-2);
}

.mastery-option:disabled {
  cursor: default;
}

.mastery-mark {
  color: var(--accent);
  font-size: var(--fs-md);
}

/* ---------- achievements: compact medallion cards ---------- */
.ach-section + .ach-section {
  margin-top: var(--s-2);
}

.ach-grid {
  --card-min: 280px;
}

.achievement {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 6px 12px;
  align-items: start;
  padding: 12px 14px;
}

.achievement > :not(.medallion) {
  grid-column: 2;
}

.achievement.done {
  border-color: var(--accent-line);
  background: linear-gradient(160deg, var(--accent-soft), transparent 60%), var(--panel);
}

.medallion {
  grid-row: span 3;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  color: var(--dim);
  background: var(--bg-2);
  border: 1px solid var(--line-2);
}

.medallion svg.ring {
  position: absolute;
  inset: -1px;
  width: calc(100% + 2px);
  height: calc(100% + 2px);
  transform: rotate(-90deg);
}

.achievement.done .medallion {
  color: var(--on-accent);
  background: radial-gradient(circle at 50% 35%, var(--accent-2), var(--accent) 60%, color-mix(in srgb, var(--accent) 60%, var(--bg)));
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.achievement-name {
  font-weight: 600;
  font-size: var(--fs-sm);
  line-height: 1.3;
}

.achievement-desc {
  font-size: var(--fs-xs);
  color: var(--muted);
}

.achievement-progress {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-size: var(--fs-xs);
  color: var(--dim);
}

.achievement-progress .bar {
  flex: 1;
}

.achievement-rewards {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: var(--fs-xs);
}

/* lasting rewards (points, tabs, bonuses, uniques) stand out from currency */
.io-item.ach-perk {
  color: var(--accent);
  border-color: var(--accent-line);
}

.io-item.ach-perk.unique-name {
  color: var(--unique);
  cursor: help;
}

.ach-bonuses {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: var(--s-2);
}

.area-drops {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--fs-xs);
}
.unique-name {
  color: var(--unique);
}

/* portrait art: keep faces in frame when cropped into small shapes */
.crest img.art,
.portrait img.art,
.quest-portrait img.art {
  object-position: 50% 22%;
}
.class-card img.class-art {
  width: calc(100% + 32px);
  margin: -16px -16px 4px;
  height: 220px;
  object-fit: cover;
  object-position: 50% 20%;
  border-radius: inherit;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent);
  mask-image: linear-gradient(180deg, #000 70%, transparent);
}

/* ---------- feedback, reviews & admin ---------- */

.stars {
  display: inline-flex;
  gap: 2px;
  line-height: 1;
}

.star {
  color: var(--line-2);
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  cursor: default;
}

button.star {
  cursor: pointer;
}

.star.on {
  color: var(--accent);
}

.admin-two {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--s-3, 12px);
}

.admin-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--s-3, 12px);
  margin: var(--s-3, 12px) 0;
}

.admin-stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
}

.admin-stat-value {
  font-size: 1.6em;
  font-weight: 700;
  color: var(--accent-2);
  font-variant-numeric: tabular-nums;
}

.admin-stat-label {
  color: var(--muted);
}

.admin-bars {
  display: grid;
  gap: 6px;
}

.admin-bar-row {
  display: grid;
  grid-template-columns: 90px 1fr 40px;
  align-items: center;
  gap: 8px;
}

.admin-bar-label {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.admin-bar-track {
  height: 10px;
  background: var(--panel-2);
  border-radius: 5px;
  overflow: hidden;
}

.admin-bar-fill {
  display: block;
  height: 100%;
  background: var(--accent);
}

.admin-bar-n {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.admin-message {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 8px 0;
}

/* ============ campaign: continent and act maps ============ */
.continent-card {
  padding: 0;
  overflow: hidden;
  /* the sea runs past the map's own frame when the card is wider than it */
  background: #0b1219;
}

.continent,
.act-map {
  display: block;
  width: 100%;
  height: auto;
}

.continent {
  max-height: 340px;
}

.continent-sea {
  fill: #0b1219;
}

.continent-region path {
  fill: #1f2328;
  stroke: #3d3a32;
  stroke-width: 2;
  stroke-linejoin: round;
  transition: fill 0.2s;
}

.continent-region.open {
  cursor: pointer;
}

.continent-region.open path {
  fill: #2a2b26;
}

.continent-region.open:hover path {
  fill: #34332b;
}

.continent-region.selected path {
  fill: #3a3627;
  stroke: var(--accent);
  stroke-width: 3;
}

.continent-region.locked path {
  fill: #16191d;
  stroke-dasharray: 6 5;
}

.continent-region text {
  text-anchor: middle;
  pointer-events: none;
  font-family: var(--font-display);
}

.continent-act {
  font-size: 13px;
  letter-spacing: 0.2em;
  fill: var(--dim);
}

.continent-name {
  font-size: 19px;
  fill: var(--text);
}

.continent-region.locked .continent-name,
.continent-region.locked .continent-act {
  fill: #4a4f57;
}

.continent-region.selected .continent-name {
  fill: var(--accent-2);
}

.continent-dot {
  fill: #4a4f57;
  pointer-events: none;
}

.continent-dot.open {
  fill: var(--text);
}

.continent-dot.cleared {
  fill: var(--accent);
}

.continent-here {
  fill: none;
  stroke: var(--success);
  stroke-width: 2.5;
  pointer-events: none;
  animation: tut-pulse 1.6s ease-in-out infinite;
}

.act-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
  gap: var(--s-4);
  align-items: start;
}

.act-map-card {
  padding: 0;
  overflow: hidden;
  background: #0b1219;
}

.act-map {
  max-height: 640px;
}

.act-map-region {
  fill: #191c20;
  stroke: #2c2f33;
  stroke-width: 1.5;
}

.act-map-region.this {
  fill: #2a2b26;
  stroke: #4d4636;
  stroke-width: 2;
}

.act-road {
  stroke: #4a4f57;
  stroke-width: 2.5;
  stroke-dasharray: 5 5;
  stroke-linecap: round;
}

.act-road.walked {
  stroke: var(--accent);
  stroke-dasharray: none;
  opacity: 0.75;
}

.act-road.side {
  stroke-width: 1.5;
}

.act-node {
  cursor: pointer;
}

.act-node-ring {
  fill: #121417;
  stroke: #4a4f57;
  stroke-width: 2;
}

.act-node-core {
  fill: #3a3f47;
}

.act-node.open .act-node-core,
.act-node.current .act-node-core {
  fill: var(--zone);
}

.act-node.open .act-node-ring {
  stroke: var(--zone);
}

.act-node.cleared .act-node-ring {
  stroke: var(--accent);
}

.act-node.cleared .act-node-core {
  fill: var(--accent);
}

.act-node.current .act-node-ring {
  stroke: var(--success);
  stroke-width: 3;
  animation: tut-pulse 1.6s ease-in-out infinite;
}

.act-node.selected .act-node-ring {
  stroke: var(--accent-2);
  stroke-width: 3.5;
}

.act-node:hover .act-node-ring {
  stroke-width: 3.5;
}

.act-node-name {
  font-size: 9px;
  font-weight: 600;
  fill: var(--text);
  paint-order: stroke;
  stroke: #0b0d10;
  stroke-width: 3px;
  pointer-events: none;
}

/* a boss-count gate: the number of this act's bosses the area needs */
.act-node-gate {
  text-anchor: middle;
  font-size: 9px;
  font-weight: 800;
  fill: #0b0d10;
  pointer-events: none;
}

.act-node.locked .act-node-name {
  fill: var(--dim);
}

@container (max-width: 860px) {
  .act-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ============ item click menu ============ */
.item-menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 900;
}

.item-menu {
  position: fixed;
  min-width: 200px;
  padding: 6px;
  display: grid;
  gap: 2px;
  background: var(--bg);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

.item-menu-title {
  padding: 4px 8px 6px;
  font-weight: 600;
  font-size: var(--fs-sm);
  color: var(--rar, var(--text));
  border-bottom: 1px solid var(--line);
  margin-bottom: 2px;
}

.item-menu-btn {
  text-align: left;
  padding: 7px 8px;
  border-radius: var(--r-xs);
  background: none;
  border: none;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-sm);
  cursor: pointer;
}

.item-menu-btn:hover:not(:disabled) {
  background: var(--bg-2);
  color: var(--accent-2);
}

.item-menu-btn.danger:hover:not(:disabled) {
  color: var(--bad);
}

.item-menu-btn:disabled {
  cursor: default;
  color: var(--dim);
}

/* stash: what you're wearing beside the bag */
.stash-top {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--s-4);
  align-items: start;
}

@container (max-width: 900px) {
  .stash-top {
    grid-template-columns: minmax(0, 1fr);
  }
}

.hx-a,
.hx-b,
.hx-c {
  display: grid;
  gap: var(--s-5);
}

.hx-top .char-banner {
  flex: 1;
}

/* have / need material chips */
.hx-haveneed {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px 10px;
}

.hx-mat {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
}

.hx-mat.ok {
  color: var(--good);
}

.hx-mat.short {
  color: var(--bad);
}

/* stations: what you have up top, then every tier as a ladder */
.hx-stations-wrap {
  display: grid;
  gap: 8px;
}

.hx-stations {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: var(--s-3);
}

.hx-station {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hx-station.ready {
  box-shadow: inset 3px 0 0 var(--success);
}

.hx-station.locked .hx-station-head,
.hx-station.locked .hx-tiers {
  opacity: 0.7;
}

.hx-station-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hx-station-icon {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-sm);
  border: 1px solid color-mix(in srgb, var(--station) 40%, var(--line));
  background: radial-gradient(circle, color-mix(in srgb, var(--station) 20%, transparent), transparent 70%), var(--bg-2);
}

.hx-station-title {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.hx-station-level {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
}

.hx-station-level .pip {
  width: 12px;
}

.hx-have {
  display: grid;
  gap: 4px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--station) 7%, var(--bg-2));
}

.hx-perks {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 14px;
  font-size: var(--fs-sm);
  font-weight: 600;
}

.hx-tiers {
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--fs-sm);
}

.hx-tier {
  position: relative;
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 8px;
  padding-bottom: 8px;
}

.hx-tier:last-child {
  padding-bottom: 0;
}

/* the rail joining one tier to the next */
.hx-tier:not(:last-child)::before {
  content: '';
  position: absolute;
  top: 20px;
  bottom: 0;
  left: 9px;
  width: 2px;
  background: var(--line);
}

.hx-tier.done:not(:last-child)::before {
  background: var(--station);
}

.hx-tier-mark {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  color: var(--dim);
  font-size: var(--fs-2xs);
  font-weight: 700;
}

.hx-tier.done .hx-tier-mark {
  border-color: var(--station);
  background: var(--station);
  color: var(--bg);
}

.hx-tier.next .hx-tier-mark {
  border-color: var(--station);
  color: var(--text);
}

.hx-tier-body {
  display: grid;
  gap: 6px;
  min-width: 0;
  line-height: 20px;
}

.hx-tier.done .hx-tier-body {
  color: var(--muted);
}

.hx-tier.next .hx-tier-body {
  font-weight: 600;
}

.hx-tier.later .hx-tier-body {
  color: var(--dim);
}

.hx-tier-buy {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  font-weight: 400;
}

/* B: skill dials */
.hx-dials-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-4) var(--s-6);
}

.hx-dial-group {
  display: grid;
  gap: 8px;
}

.hx-dials {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.hx-dial {
  position: relative;
  width: 112px;
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 8px 4px;
  border-radius: var(--r);
  border: 1px solid transparent;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.hx-dial:hover {
  border-color: var(--line-2);
  background: var(--bg-2);
}

.hx-dial.running {
  border-color: var(--success);
}

.hx-dial-ring {
  width: 64px;
  height: 64px;
}

.hx-dial-track {
  fill: var(--bg-2);
  stroke: var(--line);
  stroke-width: 5;
}

.hx-dial-fill {
  fill: none;
  stroke: var(--skill);
  stroke-width: 5;
  stroke-linecap: round;
}

.hx-dial-center {
  position: absolute;
  top: 8px;
  width: 64px;
  height: 64px;
  display: grid;
  place-content: center;
  justify-items: center;
  line-height: 1;
}

.hx-dial-center b {
  font-family: var(--font);
  font-size: var(--fs-md);
}

.hx-dial-name {
  font-size: var(--fs-sm);
  font-weight: 600;
}

.hx-dial-next {
  font-size: var(--fs-2xs);
  text-align: center;
  line-height: 1.2;
}

/* ============ Hideout (home) ============ */
.hideout-hero {
  display: grid;
  justify-items: center;
  padding: var(--s-5) var(--s-5) var(--s-4);
}

.hideout-hero.hideout-scene[style*="--scene-art"] {
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--bg) 25%, transparent), color-mix(in srgb, var(--bg) 70%, transparent)), var(--scene-art);
  background-size: cover;
  background-position: center 35%;
  min-height: 190px;
  align-content: end;
}

.hideout-hero .char-banner {
  position: relative;
  width: min(100%, 760px);
  background: radial-gradient(420px 160px at 0% 50%, color-mix(in srgb, var(--class) 18%, transparent), transparent 70%), color-mix(in srgb, var(--panel) 84%, transparent);
  backdrop-filter: blur(4px);
}

/* character stats · worn gear · where to go, side by side */
.home-top {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--s-4);
  align-items: stretch;
}

.home-card {
  display: grid;
  align-content: start;
  gap: 4px;
}

.home-stats {
  display: grid;
  gap: 2px;
}

.home-stat {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 2px;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
  font-size: var(--fs-sm);
}

.home-stat:last-child {
  border-bottom: 0;
}

.home-res {
  display: inline-flex;
  gap: 4px;
  align-items: baseline;
}

/* worn gear: the Equipment page's paper doll, centred */
.home-doll {
  justify-items: center;
}

/* quick buttons to every page you use from home */
.home-nav {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.home-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel-2), var(--bg-2));
  color: var(--text);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-fast), transform var(--dur-fast);
}

.home-nav-btn:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.home-nav-btn .nav-badge {
  margin-left: auto;
}

button.hx-mat {
  padding: 1px 4px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: none;
  font: inherit;
  font-size: var(--fs-xs);
  cursor: pointer;
}

button.hx-mat:hover {
  border-color: var(--line-2);
  background: var(--bg-2);
}

@container (max-width: 1100px) {
  .home-top {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .home-nav-card {
    grid-column: 1 / -1;
  }
  .home-nav {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@container (max-width: 640px) {
  .home-top {
    grid-template-columns: minmax(0, 1fr);
  }
  .home-nav {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Player Market */
.market-filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  align-items: center;
}

.market-filters .input {
  flex: 1 1 140px;
  min-width: 0;
}

.market-sell {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  align-items: center;
  margin-top: var(--s-3);
}

.market-sell .input {
  width: 180px;
}

.market-bid {
  width: 90px;
}

/* ---------- challenge modes ---------- */

.challenge-toggles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
}

.challenge-toggle {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
}

.challenge-toggle.on {
  border-color: var(--accent);
}

.challenge-toggle > span {
  display: grid;
  gap: 2px;
}

.challenge-tag {
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 700;
}

.challenge-tag.hardcore {
  color: var(--bad);
}

.fallen-card {
  align-items: center;
  text-align: center;
}
/* Admin diagnostics remain scrollable on narrow screens and never render raw snapshot HTML. */
.admin-table-wrap { overflow-x: auto; margin: 12px 0; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th, .admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.admin-snapshot, .admin-message-form, .admin-mail { margin-top: 12px; padding: 10px 0; }
.admin-snapshot summary, .admin-message-form summary, .admin-mail summary { cursor: pointer; }
.admin-snapshot pre { max-height: 440px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
.admin-event-builder { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
.admin-event-builder label, .admin-message-form label { display: grid; gap: 5px; font-size: 12px; }
.admin-message-form .textarea { width: 100%; margin: 10px 0; }
.admin-message-form .row > label { max-width: 100%; min-width: 0; }
.admin-message-form select { max-width: 100%; }
.admin-message-form > .btn { margin-top: 10px; }
.admin-funnel { display: flex; gap: 8px; overflow-x: auto; }
.admin-funnel > div { flex: 1; min-width: 76px; display: grid; gap: 8px; text-align: center; padding: 14px 8px; background: var(--bg); border: 1px solid var(--line); }
.admin-funnel b { font-size: 22px; }
.admin-funnel span { font-size: 12px; }

/* events calendar: the Hideout card and the banner's "coming up" line */
.event-soon {
  margin: 0 0 var(--s-4);
  padding: 6px 12px;
  border-left: 2px solid var(--accent);
}
.events-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.events-list li {
  display: block;
  min-width: 0;
}
.events-list .badge {
  margin-left: 6px;
}
.events-sub {
  margin: 12px 0 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ==========================================================================
   Masterwork / Profession Projects Board
   ========================================================================== */
.project-board-section {
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
}

.project-board-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-3);
  padding-bottom: var(--s-2);
  border-bottom: 1px solid var(--line);
}

.project-board-title-group {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.project-board-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r);
  background: var(--panel-2);
  border: 1px solid var(--accent-line);
  color: var(--accent);
  box-shadow: 0 0 10px var(--accent-soft);
}

.project-board-heading {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
  color: var(--accent-2);
  letter-spacing: 0.04em;
}

.project-board-summary {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-wrap: wrap;
}

.project-board-desc-banner {
  padding: var(--s-3) var(--s-4);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: var(--r);
  font-size: var(--fs-xs);
  color: var(--muted);
  display: flex;
  align-items: flex-start;
  gap: var(--s-2);
  line-height: 1.5;
}

.project-board-desc-banner b {
  color: var(--text);
}

/* Active Project Banner */
.project-active-card {
  background: linear-gradient(135deg, rgba(209, 173, 114, 0.1), var(--panel) 60%), var(--bg-2);
  border: 1px solid var(--accent-line);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 14px var(--accent-soft);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  position: relative;
  overflow: hidden;
}

.project-active-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.project-active-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-2);
}

.project-active-title {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--accent-2);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}

.project-active-time {
  font-family: var(--font);
  font-size: var(--fs-sm);
  color: var(--good);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
}

.project-active-escrow {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-wrap: wrap;
  font-size: var(--fs-xs);
  color: var(--dim);
  background: var(--bg-2);
  padding: 6px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
}

.project-active-actions {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-wrap: wrap;
}

/* Filter Strip */
.project-filter-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-2);
}

/* Individual Project Card */
.project-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur-fast);
  position: relative;
}

.project-card:hover {
  border-color: var(--line-2);
}

.project-card.ready {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
}

.project-card.locked {
  background: color-mix(in srgb, var(--bg-2) 80%, var(--panel));
  border-style: dashed;
  border-color: var(--line);
}

.project-card.running {
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-soft);
}

.project-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-3);
  flex-wrap: wrap;
}

.project-card-title-col {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-width: 0;
}

.project-art-slot {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: var(--r);
  background: var(--bg-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.project-art-slot img {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

.project-art-slot.rar-unique {
  border-color: var(--unique);
  background: radial-gradient(circle, rgba(201, 124, 68, 0.2), transparent 70%), var(--bg-2);
  box-shadow: 0 0 8px rgba(201, 124, 68, 0.3);
}

.project-art-slot.rar-magic {
  border-color: var(--magic);
  background: radial-gradient(circle, rgba(143, 156, 242, 0.2), transparent 70%), var(--bg-2);
  box-shadow: 0 0 8px rgba(143, 156, 242, 0.3);
}

.project-title-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.project-card-name {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
}

.project-card-name.rar-unique {
  color: var(--unique);
}

.project-card-name.rar-magic {
  color: var(--magic);
}

.project-card-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.project-card-head-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* Meta Stats Strip */
.project-meta-strip {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
  font-size: var(--fs-xs);
  color: var(--muted);
  padding: 6px 10px;
  background: var(--bg-2);
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
}

.project-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.project-meta-item.xp {
  color: var(--accent-2);
  font-weight: 600;
}

.project-meta-item.time {
  color: var(--text);
}

/* Description / Lore */
.project-desc-panel {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-line);
  border-radius: var(--r-sm);
  padding: var(--s-2) var(--s-3);
  font-size: var(--fs-xs);
  line-height: 1.5;
  color: var(--text);
}

.project-warn-banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  border-radius: var(--r-sm);
  padding: 6px 10px;
  font-size: var(--fs-xs);
  color: var(--warn);
  line-height: 1.4;
}

/* The Workbench Exchange Grid (Inputs -> Outcome) */
.project-exchange-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  gap: var(--s-3);
}

@media (max-width: 680px) {
  .project-exchange-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

.project-workbench-panel {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: var(--s-3);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.project-panel-label {
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.project-inputs-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.project-input-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
}

.project-input-row.missing {
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);
  background: var(--danger-soft);
}

.project-input-row.clickable {
  cursor: pointer;
  user-select: none;
  transition: background var(--dur-fast), border-color var(--dur-fast);
}

.project-input-row.clickable:hover {
  background: var(--panel-2);
  border-color: var(--accent-line);
}

.project-input-row.clickable.missing:hover {
  background: color-mix(in srgb, var(--danger) 22%, var(--panel-2));
  border-color: var(--danger);
}

.project-input-row.clickable:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.project-input-source-chip {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: var(--fs-2xs);
  padding: 1px 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--dim);
  margin-left: 2px;
  flex-shrink: 0;
  transition: border-color var(--dur-fast), color var(--dur-fast);
}

.project-input-row.clickable:hover .project-input-source-chip {
  color: var(--accent-2);
  border-color: var(--accent-line);
}

.project-input-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.project-input-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}

.project-input-amounts {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  flex-shrink: 0;
}

.project-input-amounts.sufficient {
  color: var(--good);
}

.project-input-amounts.insufficient {
  color: var(--bad);
}

.project-base-selector-box {
  margin-top: 4px;
  padding: 6px 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.project-base-select {
  width: 100%;
  font-size: var(--fs-xs);
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: var(--r-xs);
  padding: 4px 6px;
  color: var(--text);
}

.project-base-missing-alert {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: var(--fs-xs);
  color: var(--bad);
  line-height: 1.35;
}

.project-base-jump-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
  padding: 2px 6px;
  font-size: var(--fs-2xs);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-xs);
  color: var(--text);
  cursor: pointer;
  transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
}

.project-base-jump-btn:hover {
  background: var(--panel-2);
  border-color: var(--accent-line);
  color: var(--accent-2);
}

.project-arrow-col {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dim);
  font-size: 20px;
}

@media (max-width: 680px) {
  .project-arrow-col {
    transform: rotate(90deg);
    padding: var(--s-1) 0;
  }
}

.project-reward-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 100%;
}

.project-reward-card.rar-unique {
  border-color: color-mix(in srgb, var(--unique) 55%, var(--line));
  background: radial-gradient(circle at top right, rgba(201, 124, 68, 0.12), transparent 70%), var(--bg-2);
}

.project-reward-card.rar-magic {
  border-color: color-mix(in srgb, var(--magic) 55%, var(--line));
  background: radial-gradient(circle at top right, rgba(143, 156, 242, 0.12), transparent 70%), var(--bg-2);
}

.project-reward-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}

.project-reward-name {
  font-weight: 700;
  font-size: var(--fs-sm);
  color: var(--text);
}

.project-reward-name.rar-unique {
  color: var(--unique);
}

.project-reward-name.rar-magic {
  color: var(--magic);
}

.project-reward-mods {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--fs-xs);
}

.project-reward-mod-line {
  color: var(--magic);
  line-height: 1.3;
}

.project-reward-mod-line.unique-flavour {
  color: var(--unique);
  font-style: italic;
  margin-top: 2px;
}

.project-reward-materials-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.project-reward-mat-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  color: var(--text);
}

.project-reward-delivery {
  font-size: var(--fs-2xs);
  color: var(--dim);
  margin-top: auto;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Material Sources */
.project-sources-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: var(--fs-xs);
  color: var(--dim);
}

.project-source-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: var(--fs-xs);
  cursor: pointer;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}

.project-source-chip:hover {
  border-color: var(--accent-line);
  background: var(--panel-2);
  color: var(--accent-2);
}

/* Action Footer */
.project-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  flex-wrap: wrap;
  padding-top: var(--s-3);
  border-top: 1px solid var(--line);
}

.project-runs-control {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--muted);
}

.project-stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  overflow: hidden;
  background: var(--bg-2);
}

.project-stepper button {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 4px 8px;
  cursor: pointer;
  font-size: var(--fs-sm);
  line-height: 1;
}

.project-stepper button:hover:not(:disabled) {
  background: var(--panel-3);
  color: var(--accent);
}

.project-stepper input {
  width: 44px;
  text-align: center;
  background: transparent;
  border: none;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  color: var(--text);
  font-size: var(--fs-xs);
  padding: 4px 2px;
  font-variant-numeric: tabular-nums;
}

.project-preset-btn {
  padding: 2px 7px;
  font-size: var(--fs-2xs);
  border-radius: var(--r-xs);
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--muted);
  cursor: pointer;
  transition: all var(--dur-fast);
}

.project-preset-btn:hover {
  border-color: var(--accent-line);
  color: var(--text);
}

.project-action-group {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-wrap: wrap;
  margin-left: auto;
}

.project-blocker-note {
  font-size: var(--fs-xs);
  color: var(--bad);
  display: flex;
  align-items: center;
  gap: 5px;
}

/*
 * 1.0 review fixes (tooltips, toasts, quest tracker, top bar, combat on phones, character creation).
 * This file loads before styles.css, so rules that override an existing one start with `html` to win the tie.
 */

/* ============ tooltips ============ */
/* a long press shows the tooltip: don't let the phone select text or pop its own menu instead */
.tip-anchor {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

html .tooltip-layer {
  max-width: calc(100vw - 16px);
}

html .tooltip-layer .tip {
  max-width: min(340px, calc(100vw - 16px));
}

/* ============ toasts: a corner of the screen, click to clear ============ */
html .toasts {
  left: auto;
  right: 16px;
  bottom: 52px; /* clear of the xp bar */
  transform: none;
  align-items: flex-end;
  width: auto;
  max-width: min(380px, calc(100vw - 32px));
  pointer-events: none;
}

html .toast {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  padding: 7px 10px 7px 14px;
  border-radius: var(--r);
  font: inherit;
  font-weight: 600;
  font-size: var(--fs-sm);
  text-align: left;
  color: var(--text);
  cursor: pointer;
  pointer-events: auto;
}

html .toast:hover {
  background: var(--panel);
}

.toast-text {
  min-width: 0;
}

.toast-x {
  flex: none;
  color: var(--dim);
  font-size: 16px;
  line-height: 1;
}

@media (max-width: 860px) {
  /* phones: along the top, over the activity bar, so it never covers a button you're about to press */
  html .toasts {
    top: calc(6px + env(safe-area-inset-top, 0px));
    bottom: auto;
    right: 8px;
    left: 8px;
    max-width: none;
    align-items: stretch;
    gap: 4px;
  }
  html .toast {
    padding: 6px 10px;
    font-size: var(--fs-xs);
    justify-content: space-between;
  }
  html .toast .toast-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* ============ top bar: pinned currencies only ============ */
.topbar-pins {
  display: flex;
  justify-content: flex-end;
  min-width: 0;
}

html .topbar-pins .currency-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}

html .topbar-pins .currency-strip .chip {
  display: inline-flex;
}

/* with only what you chose up there, there's room to say which orb is which */
html .topbar-pins .currency-strip .chip .dim {
  display: inline;
}

/* a pinned orb in the Stash's Currency tab */
html .currency-slot {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

html .currency-slot.pinned {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) inset;
}

.currency-pin {
  position: absolute;
  top: 6px;
  left: 7px;
  font-size: var(--fs-2xs);
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
}

.currency-pin-hint {
  margin-bottom: var(--s-2);
}

.nav-version-mobile {
  display: none;
}

@media (max-width: 860px) {
  /* nothing pinned: the character plate takes the whole second row */
  html .topbar-pins:not(:has(.currency-strip)) {
    display: none;
  }
  html .topbar:not(:has(.topbar-pins .currency-strip)) .char-plate {
    grid-column: 1 / -1;
  }
  /* something pinned: its own row under the plate, scrolling sideways if it's long */
  html .topbar-pins {
    grid-column: 1 / -1;
    justify-content: flex-start;
  }
  html .char-plate-body {
    flex: 1;
  }
  .nav-version-mobile {
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: var(--fs-2xs);
    color: var(--dim);
    white-space: nowrap;
  }
}

/* ============ tutorial quest ============ */
/* without the right-hand feed, the quest sits at the top of the page in the flow: it can't cover what it points at */
@media (max-width: 1280px) {
  html .quest.floating {
    display: flex;
    position: static;
    width: auto;
    max-width: 1280px;
    margin: 0 auto var(--s-4);
    box-shadow: none;
    z-index: auto;
  }
}

@media (max-width: 860px) {
  html .quest.floating {
    padding: 10px;
    gap: 6px;
  }
  html .quest.floating .quest-portrait {
    width: 34px;
    height: 34px;
  }
}

html .quest-objective {
  align-items: center;
}

html .quest-show {
  flex: none;
  min-height: 0;
  padding: 2px 10px;
}

/* ============ combat ============ */
/* even value columns: long modifier text wraps inside them instead of stretching one */
html .matchup {
  grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr);
}

.matchup-mods {
  grid-column: 2 / -1;
  min-width: 0;
}

/* the phone strip (CombatDock): off on wider screens, which show the field with the skill bar under it */
.combat-dock {
  display: none;
}

@media (max-width: 700px) {
  /* held at the bottom of the screen while the rest of the fight scrolls under it */
  .combat-dock {
    position: sticky;
    /* flush with the bottom of the scrolling area, past the page's own bottom padding */
    bottom: calc(-1 * var(--s-4));
    z-index: 20;
    display: grid;
    gap: 6px;
    margin: 0 calc(-1 * var(--s-3));
    border-radius: var(--r) var(--r) 0 0;
    padding: 8px var(--s-3) 10px;
    border-top: 1px solid var(--line-2);
    background: var(--panel);
    box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.45);
  }
  /* the dock has the skills and flasks: no second copy under the field */
  html .combat-page .action-bar {
    display: none;
  }
  .dock-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: var(--fs-xs);
  }
  .dock-name {
    flex: 0 1 38%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .dock-warning .dock-name {
    flex-basis: 60%;
  }
  .dock-warning .bar {
    flex: 1;
  }
  .dock-bars {
    flex: 1;
    display: grid;
    gap: 2px;
    min-width: 0;
  }
  .dock-vitals {
    align-items: end;
  }
  .dock-vitals .dock-bars.mana {
    flex: 0 0 34%;
  }
  /* the fight's own buttons, smaller, so the field starts higher */
  html .combat-page .page-head .page-actions .btn {
    min-height: 0;
    padding: 6px 10px;
    font-size: var(--fs-sm);
  }
  .combat-dock .bar.labelled {
    height: 16px;
  }
  .combat-dock .bar-label {
    font-size: var(--fs-2xs);
  }
  /* six skills in one row: icon, name, cooldown */
  html .combat-dock .skill-bar {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 4px;
  }
  html .combat-dock .skill-btn {
    min-height: 0;
    padding: 4px 2px 3px;
    gap: 1px;
  }
  html .combat-dock .skill-btn.empty {
    min-height: 52px;
  }
  html .combat-dock .skill-gem .gem-icon {
    width: 24px !important;
    height: 28px !important;
  }
  html .combat-dock .slot-key,
  html .combat-dock .skill-meta,
  html .combat-dock .skill-rule {
    display: none;
  }
  html .combat-dock .skill-btn.unusable .skill-rule {
    display: none;
  }
  html .combat-dock .skill-name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
  }
  /* flasks in one row, short and wide */
  html .combat-dock .flask-belt {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
    gap: 4px;
  }
  html .combat-dock .flask {
    width: auto;
    height: 38px;
    border-radius: 8px;
    padding: 2px 4px;
  }
  html .combat-dock .flask-charges {
    font-size: var(--fs-2xs);
  }
}

/* ============ character creation: class, then name ============ */
/* clip rather than hide, so the Next bar can stick to the bottom of the window */
html .screen {
  overflow: clip;
}

.create-head {
  align-items: flex-end;
}

.create-step {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

html .create-chosen {
  display: flex;
  align-items: center;
  gap: 14px;
  border-color: var(--class);
}

html .create-next {
  position: sticky;
  bottom: 12px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  border-color: color-mix(in srgb, var(--class, var(--line-2)) 70%, var(--line));
}

.create-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.create-actions .btn.primary {
  min-width: 160px;
}

@media (max-width: 480px) {
  html .create-next {
    padding: 10px 12px;
  }
  html .create-next .dim {
    display: none;
  }
}

/* ============ catch-up on time away ============ */
html .catch-up .modal {
  display: grid;
  gap: var(--s-4);
}

/* ==========================================================================
   Round 2, session 2: Hideout, Campaign maps and the Map Device.
   Imported by the components that use it (Fold, HideoutPage, CampaignPage, MapDevicePage).
   ========================================================================== */

/* ============ folding sections: fold on phones, always open wider ============ */
.fold-head {
  min-height: 28px;
}

.fold-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  pointer-events: none;
}

.fold-chevron {
  display: none;
  font-size: 12px;
  color: var(--dim);
  transition: transform var(--dur-fast);
}

@container (max-width: 640px) {
  .fold-toggle {
    pointer-events: auto;
    cursor: pointer;
    min-height: 32px;
    flex: 1;
  }
  .fold-chevron {
    display: inline-block;
    transform: rotate(90deg);
  }
  .fold.closed .fold-chevron {
    transform: none;
  }
  .fold.closed > .fold-body {
    display: none;
  }
  .fold.closed > .fold-head {
    margin-bottom: 0;
  }
}

/* ============ Hideout: banner vitals ============ */
.hideout-hero .char-banner {
  flex-wrap: wrap;
  row-gap: var(--s-3);
}

.char-vitals {
  flex: 1 1 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 6px;
  padding-top: var(--s-3);
  border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}

.char-vital {
  display: grid;
  gap: 1px;
  padding: 5px 9px;
  border-radius: var(--r-sm);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  background: color-mix(in srgb, var(--bg-2) 75%, transparent);
  line-height: 1.15;
}

.char-vital small {
  font-size: var(--fs-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--dim);
}

.char-vital b {
  font-size: var(--fs-md);
}

.char-vital.life {
  border-color: color-mix(in srgb, var(--life) 50%, var(--line));
}

.char-vital.life b {
  color: var(--life-2);
}

.char-vital.es {
  border-color: color-mix(in srgb, var(--es) 50%, var(--line));
}

.char-vital.es b {
  color: var(--es-2);
}

.char-vital.mana {
  border-color: color-mix(in srgb, var(--mana) 60%, var(--line));
}

.char-vital.mana b {
  color: var(--mana-2);
}

.char-vital.res {
  grid-column: span 2;
}

.char-vital.res .num {
  display: inline-flex;
  gap: 8px;
  font-size: var(--fs-md);
}

.char-vital.res b.good {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: var(--good);
  text-underline-offset: 3px;
}

@container (max-width: 640px) {
  .hideout-hero {
    padding: var(--s-3);
  }
  .hideout-hero .char-banner {
    gap: var(--s-3);
    padding: var(--s-3);
  }
  /* the crest's size comes in as an inline style */
  .hideout-hero .char-banner .crest {
    width: 52px !important;
    height: 52px !important;
  }
  .char-banner-level {
    min-width: 64px;
    padding: 6px 8px;
  }
  .char-banner-level b {
    font-size: 26px;
  }
  .char-vitals {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .char-vital {
    padding: 4px 7px;
  }
  .char-vital b,
  .char-vital.res .num {
    font-size: var(--fs-sm);
  }
  .char-vital.res {
    grid-column: span 3;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .char-vital.res .num {
    gap: 12px;
  }
}

/* ============ Hideout: top row (character, equipment, life skills) ============ */
.home-top.no-skills {
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
}

.home-card.fold {
  display: block;
  justify-items: normal;
}

.home-card .fold-body {
  display: grid;
  align-content: start;
  gap: 4px;
}

.home-doll .fold-body {
  justify-items: center;
}

@container (max-width: 1100px) {
  .home-top .home-skills {
    grid-column: 1 / -1;
  }
  .home-skills .fold-body {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--s-2) var(--s-4);
  }
  .home-skills .hl-now {
    grid-column: 1 / -1;
  }
}

@container (max-width: 640px) {
  .home-skills .fold-body {
    grid-template-columns: minmax(0, 1fr);
  }
  .home-skills .hl-skills {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 4px;
  }
}

/* what's running now */
.hl-now {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--skill, var(--line)) 55%, var(--line));
  background: radial-gradient(260px 90px at 0% 50%, color-mix(in srgb, var(--skill, transparent) 16%, transparent), transparent 70%), var(--bg-2);
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.hl-now.idle {
  cursor: default;
  border-style: dashed;
  border-color: var(--line-2);
  font-size: var(--fs-sm);
}

.hl-now-icon {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid var(--skill);
  background: var(--panel);
  animation: hl-pulse 2.4s ease-in-out infinite;
}

@keyframes hl-pulse {
  50% {
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--skill) 22%, transparent);
  }
}

.hl-now-body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 3px;
}

.hl-now-kicker {
  font-size: var(--fs-2xs);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--skill);
  font-weight: 600;
}

.hl-group {
  display: grid;
  align-content: start;
  gap: 4px;
}

.hl-skills {
  display: grid;
  align-content: start;
  gap: 2px;
}

/* one life skill: icon, name, level, a thin bar and its next unlock */
.hl-skill {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  grid-template-areas:
    'icon name lvl'
    'icon bar bar'
    'icon next next';
  align-items: center;
  column-gap: 8px;
  row-gap: 2px;
  width: 100%;
  padding: 5px 6px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.hl-skill > .game-icon,
.hl-skill > svg {
  grid-area: icon;
  align-self: start;
  margin-top: 2px;
}

.hl-skill:hover {
  border-color: var(--line-2);
  background: var(--bg-2);
}

.hl-skill.running {
  border-color: color-mix(in srgb, var(--skill) 60%, var(--line));
  background: color-mix(in srgb, var(--skill) 8%, var(--bg-2));
}

.hl-skill.is-soon {
  opacity: 0.6;
}

.hl-skill-name {
  grid-area: name;
  font-size: var(--fs-sm);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hl-skill-lvl {
  grid-area: lvl;
  font-size: var(--fs-sm);
}

.hl-skill-bar {
  grid-area: bar;
  height: 4px;
  border-radius: 2px;
  background: var(--bg-2);
  overflow: hidden;
}

.hl-skill-bar > span {
  display: block;
  height: 100%;
  background: var(--skill);
}

.hl-skill-next {
  grid-area: next;
  font-size: var(--fs-2xs);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============ Hideout: the go-to bar along the bottom ============ */
.home-goto {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 4px;
  padding: 6px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(6px);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.35);
}

.home-goto-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  min-height: 40px;
  padding: 6px 4px;
  border-radius: var(--r);
  border: 1px solid transparent;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}

.home-goto-btn:hover {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.home-goto-icon {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
}

.home-goto-icon .nav-badge {
  position: absolute;
  top: -8px;
  left: 12px;
  padding: 0 5px;
  font-size: 10px;
  line-height: 15px;
}

.home-goto-label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.home-goto-label.short {
  display: none;
}

@container (max-width: 1100px) {
  .home-goto-label.long {
    display: none;
  }
  .home-goto-label.short {
    display: inline;
  }
}

@container (max-width: 760px) {
  .home-goto {
    gap: 0;
    padding: 4px;
    border-radius: var(--r);
  }
  .home-goto-btn {
    flex-direction: column;
    gap: 3px;
    min-height: 48px;
    padding: 5px 0;
    font-size: 10px;
  }
}

/* ============ Hideout: upgrades ============ */
.fold.hx-stations-wrap {
  display: grid;
  gap: 8px;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
}

.fold.hx-stations-wrap > .fold-head {
  margin-bottom: 0;
  font-family: var(--font-display);
  font-size: var(--fs-lg);
}

.fold.hx-stations-wrap > .fold-body {
  display: grid;
  gap: 10px;
}

.hx-station.maxed {
  box-shadow: inset 3px 0 0 var(--accent);
}

.hx-next {
  display: grid;
  gap: 6px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--bg-2);
}

.hx-next.ready {
  border-color: color-mix(in srgb, var(--success) 60%, var(--line));
  background: color-mix(in srgb, var(--success) 8%, var(--bg-2));
}

.hx-next-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.hx-next-head .grow {
  flex: 1;
}

.hx-next-effect {
  font-weight: 600;
  font-size: var(--fs-sm);
}

.hx-next-buy {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}

.hx-ladder > summary {
  cursor: pointer;
  font-size: var(--fs-xs);
  color: var(--muted);
  padding: 2px 0;
}

.hx-ladder[open] > summary {
  margin-bottom: 8px;
}

/* ============ Campaign: the drawn maps ============ */
.card.cmap-card {
  padding: 0;
  overflow: hidden;
  background: #0c151b;
}

/* tall acts stay a sensible height on wide screens */
.cmap-act {
  max-width: calc(var(--aspect) * min(680px, 80vh));
  margin: 0 auto;
}

.cmap-world,
.cmap-act {
  position: relative;
  width: 100%;
  overflow: hidden;
  user-select: none;
}

.card.cmap-world-scroll {
  overflow-x: auto;
}

.cmap-world {
  min-width: 640px;
}

.cmap-world .cmap-act-label {
  background: rgba(20, 17, 12, 0.82);
  border-color: rgba(203, 180, 137, 0.45);
}

.ct-svg,
.cmap-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

img.ct-svg {
  object-fit: cover;
}

.cmap-overlay {
  pointer-events: none;
}

.ct-sea {
  fill: #0c151b;
}

.ct-shallows {
  fill: none;
  stroke: #36545c;
  stroke-width: 16;
  stroke-linejoin: round;
  opacity: 0.35;
}

.ct-coast {
  fill: none;
  stroke: #b49c6c;
  stroke-width: 4;
  stroke-linejoin: round;
  opacity: 0.85;
}

.ct-land {
  stroke: none;
}

.ct-land.neighbour {
  opacity: 0.4;
}

.ct-border {
  fill: none;
  stroke: #1a130a;
  stroke-width: 1.6;
  stroke-dasharray: 5 4;
  opacity: 0.7;
  pointer-events: none;
}

.ct-border.this {
  stroke: #c9ad74;
  stroke-width: 2.4;
  stroke-dasharray: none;
  opacity: 0.6;
}

.ct-ink {
  fill: none;
  stroke: #17120b;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.7;
}

.ct-ink-fill {
  fill: #1a140c;
  opacity: 0.55;
}

.ct-peak {
  fill: #252a31;
  stroke: #111418;
  stroke-width: 1;
  stroke-linejoin: round;
}

.ct-snow {
  fill: #c9d3dc;
  opacity: 0.8;
}

.ct-wave {
  fill: none;
  stroke: #7ea3ad;
  stroke-width: 1.3;
  stroke-linecap: round;
  opacity: 0.5;
}

.ct-isle {
  fill: #4c4430;
  stroke: #b49c6c;
  stroke-width: 0.8;
}

.ct-ember {
  fill: #c0612f;
  opacity: 0.7;
}

.ct-crack {
  fill: none;
  stroke: #0d0a10;
  stroke-width: 1.6;
  stroke-linejoin: bevel;
  opacity: 0.75;
}

.ct-region {
  transition: filter var(--dur-fast);
}

.ct-region.open {
  cursor: pointer;
}

.ct-region.open:hover {
  filter: brightness(1.25);
}

.ct-region.selected .ct-border {
  stroke: #e6c894;
  stroke-width: 3;
  stroke-dasharray: none;
  opacity: 0.85;
}

.ct-compass circle {
  fill: none;
  stroke: #b49c6c;
  stroke-width: 1.2;
  opacity: 0.5;
}

.ct-compass path {
  fill: #b49c6c;
  opacity: 0.55;
}

.ct-compass text {
  fill: #b49c6c;
  font-family: var(--font-display);
  font-size: 16px;
  opacity: 0.8;
}

.ct-here {
  fill: none;
  stroke: var(--success);
  stroke-width: 3;
  pointer-events: none;
  animation: tut-pulse 1.6s ease-in-out infinite;
}

/* the rough trail on the world map */
.cmap-trail,
.cmap-trail-under {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.cmap-trail-under {
  stroke: #0d0a06;
  stroke-width: 5;
  opacity: 0.55;
}

.cmap-trail {
  stroke: #e6c894;
  stroke-width: 2.2;
  stroke-dasharray: 2 7;
}

/* Sailing lanes and their destination dots. */
.cmap-sailing {
  stroke: #e6d6ac;
  stroke-width: 2;
  stroke-dasharray: 1 8;
}

.cmap-sailing-under {
  stroke-width: 4;
  opacity: 0.35;
}

.cmap-sea-stop {
  fill: #f2dc9e;
  stroke: #28231b;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

/* act names on the world map */
.cmap-act-label {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 0;
  min-width: 44px;
  min-height: 44px;
  padding: 4px 10px;
  border: 1px solid transparent;
  border-radius: var(--r);
  background: none;
  color: #f1e3c4;
  font-family: var(--font-display);
  text-align: center;
  text-shadow: 0 1px 2px #000, 0 0 8px #000, 0 0 3px #000;
  cursor: pointer;
  transition: background var(--dur-fast), border-color var(--dur-fast);
}

.cmap-act-label small {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #cbb489;
}

.cmap-act-label b {
  font-size: clamp(13px, 2.1cqi, 20px);
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
}

.cmap-act-label-progress {
  font-family: var(--font);
  font-size: 10px;
  color: #cbb489;
}

.cmap-act-label:hover:not(:disabled) {
  background: rgba(12, 10, 6, 0.55);
  border-color: var(--accent-line);
}

.cmap-act-label.current b {
  color: var(--accent-2);
}

.cmap-act-label.done small {
  color: var(--good);
}

.cmap-act-label.locked {
  cursor: default;
  color: #6b6f76;
}

.cmap-act-label.locked small {
  color: #555a61;
}

/* the act list under the world map */
.cmap-acts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: var(--s-3);
}

.cmap-act-card {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  margin: 0;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur-fast), transform var(--dur-fast);
}

.cmap-act-card:hover:not(:disabled) {
  border-color: var(--accent-line);
  transform: translateY(-1px);
}

.cmap-act-card.current {
  border-color: color-mix(in srgb, var(--success) 60%, var(--line));
}

.cmap-act-card.locked {
  opacity: 0.55;
  cursor: default;
}

.cmap-act-num {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--accent-line);
  background: var(--bg-2);
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--accent-2);
}

.cmap-act-body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
}

/* level 2: one act */
.cmap-act-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s-2) var(--s-3);
}

.cmap-act-head h2 {
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.cmap-act-head h2 small {
  font-size: var(--fs-xs);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
}

.cmap-act-head .grow {
  flex: 1;
}

.cmap-act-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: min(100%, 260px);
}

.cmap-act-progress .bar {
  flex: 1;
}

.cmap-act-scroll {
  overflow: auto;
  max-height: 760px;
  overscroll-behavior-x: contain;
  overscroll-behavior-y: auto;
}

/* roads between areas */
.cmap-road path {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.cmap-road-under {
  stroke: #0d0a06;
  stroke-width: 6;
  opacity: 0.5;
}

.cmap-road-line {
  stroke: #9c9077;
  stroke-width: 2.4;
  stroke-dasharray: 3 6;
}

.cmap-road.walked .cmap-road-line {
  stroke: var(--accent-2);
  stroke-width: 3;
  stroke-dasharray: none;
}

.cmap-road.side .cmap-road-line {
  stroke-width: 1.6;
}

/* areas */
.cmap-node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  overflow: visible;
  z-index: 1;
}

.cmap-node-dot {
  --size: 24px;
  width: var(--size);
  height: var(--size);
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2.5px solid #5a5f67;
  background: radial-gradient(circle at 35% 30%, #4a4f57, #22262b);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
  color: #0b0d10;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  transition: transform var(--dur-fast);
}

.cmap-node.is-side .cmap-node-dot {
  --size: 17px;
}

.cmap-node.is-boss .cmap-node-dot {
  --size: 30px;
  border-radius: 8px;
  transform: rotate(45deg);
}

.cmap-node.is-boss .cmap-node-dot > * {
  transform: rotate(-45deg);
}

.cmap-node.open .cmap-node-dot,
.cmap-node.current .cmap-node-dot {
  border-color: var(--zone);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--zone) 70%, #fff), var(--zone));
}

.cmap-node.cleared .cmap-node-dot {
  border-color: #f3dfb4;
  background: radial-gradient(circle at 35% 30%, #f3dfb4, var(--accent));
}

.cmap-node.locked .cmap-node-dot {
  color: #e5dcce;
}

.cmap-node.current .cmap-node-dot {
  border-color: var(--success);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 35%, transparent), 0 2px 6px rgba(0, 0, 0, 0.6);
  animation: tut-pulse 1.6s ease-in-out infinite;
}

.cmap-node.selected .cmap-node-dot {
  outline: 3px solid var(--accent-2);
  outline-offset: 3px;
}

.cmap-node.is-boss.selected .cmap-node-dot {
  outline-offset: 2px;
}

.cmap-node:hover .cmap-node-dot {
  transform: scale(1.12);
}

.cmap-node.is-boss:hover .cmap-node-dot {
  transform: rotate(45deg) scale(1.12);
}

.cmap-node-trial {
  position: absolute;
  top: 0;
  right: 0;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #2a1f3d;
  border: 1px solid #b493f0;
  color: #d8c6ff;
}

.cmap-node-name {
  position: absolute;
  display: grid;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.15;
  white-space: nowrap;
  color: #f1e8d6;
  text-shadow: 0 1px 2px #000, 0 0 4px #000, 0 0 2px #000;
  pointer-events: none;
}

.cmap-node-name.below {
  top: calc(100% - 6px);
  left: 50%;
  transform: translateX(-50%);
  justify-items: center;
  text-align: center;
}

.cmap-node-name.above {
  bottom: calc(100% - 6px);
  left: 50%;
  transform: translateX(-50%);
  justify-items: center;
  text-align: center;
}

.cmap-node-name.left {
  right: calc(100% - 6px);
  top: 50%;
  transform: translateY(-50%);
  justify-items: end;
  text-align: right;
}

.cmap-node-name.right {
  left: calc(100% - 6px);
  top: 50%;
  transform: translateY(-50%);
  justify-items: start;
}

.cmap-node.locked .cmap-node-name {
  color: #a7a49c;
}

.cmap-node.selected .cmap-node-name {
  color: var(--accent-2);
}

/* the key under an act's map */
.cmap-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}

.cmap-legend > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.cmap-key {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid #5a5f67;
  background: #2b2f35;
  font-style: normal;
}

.cmap-key.current {
  border-color: var(--success);
  background: var(--success);
}

.cmap-key.cleared {
  border-color: #f3dfb4;
  background: var(--accent);
}

.cmap-key.open {
  border-color: var(--accent-2);
  background: #8a7a5b;
}

.cmap-key.gate {
  width: 15px;
  height: 15px;
  display: inline-grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
  color: #e5dcce;
}

@container (max-width: 640px) {
  .cmap-act-label {
    padding: 2px 4px;
  }
  .cmap-act-label small {
    font-size: 8px;
    letter-spacing: 0.12em;
  }
  .cmap-act-label b {
    font-size: 11px;
    white-space: normal;
    max-width: 92px;
  }
  .cmap-act-label-progress {
    display: none;
  }
  .cmap-node-name {
    font-size: 10px;
  }
}

/* ============ Map Device ============ */
.card.md-stage {
  display: grid;
  grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
  gap: var(--s-5);
  align-items: start;
  padding: var(--s-5);
  overflow: hidden;
  border-color: color-mix(in srgb, var(--portal) 35%, var(--line));
  background:
    radial-gradient(420px 320px at 160px 50%, color-mix(in srgb, var(--portal) 16%, transparent), transparent 70%),
    radial-gradient(800px 300px at 100% 0%, rgba(0, 0, 0, 0.35), transparent 70%),
    var(--panel);
  transition: border-color 0.4s;
}

.md-stage-device {
  display: grid;
  gap: var(--s-3);
  justify-items: center;
}

.md-stage-info {
  display: grid;
  gap: var(--s-4);
  min-width: 0;
}

/* the device: two rune rings, the portal, a flash, four Sextant orbs */
.md-device {
  position: relative;
  width: min(300px, 74vw);
  aspect-ratio: 1;
}

.md-runes {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: md-spin 120s linear infinite;
}

.md-runes circle {
  fill: none;
  stroke: color-mix(in srgb, var(--portal) 55%, #5b5142);
  stroke-width: 1.2;
}

.md-runes text {
  fill: color-mix(in srgb, var(--portal) 70%, #8a7a5b);
  font-size: 11px;
  text-anchor: middle;
  opacity: 0.85;
}

.md-runes.inner {
  animation-duration: 80s;
  animation-direction: reverse;
}

@keyframes md-spin {
  to {
    transform: rotate(360deg);
  }
}

.md-portal {
  position: absolute;
  inset: 19%;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--portal) 75%, #000);
  background:
    radial-gradient(circle, transparent 35%, rgba(0, 0, 0, 0.75) 100%),
    var(--art, radial-gradient(circle, #2a2620, #0d0c0a)) center / cover;
  box-shadow:
    0 0 0 6px rgba(0, 0, 0, 0.45),
    0 0 26px color-mix(in srgb, var(--portal) 45%, transparent),
    inset 0 0 30px rgba(0, 0, 0, 0.8);
  transition: box-shadow 0.4s, filter 0.4s;
}

.md-device.idle .md-portal {
  filter: grayscale(0.8) brightness(0.6);
}

.md-portal-swirl {
  position: absolute;
  inset: -25%;
  background: conic-gradient(from 0deg, transparent 0 15%, color-mix(in srgb, var(--portal) 60%, transparent) 25%, transparent 40% 60%, color-mix(in srgb, var(--portal) 50%, transparent) 75%, transparent 90%);
  mix-blend-mode: screen;
  /* the portal's rounded overflow doesn't always clip a spinning layer, so it clips itself to the portal */
  clip-path: circle(33.3%);
  opacity: 0;
  animation: md-spin 14s linear infinite;
  transition: opacity 0.4s;
}

.md-device.loaded .md-portal-swirl {
  opacity: 0.25;
}

.md-device.open .md-portal-swirl {
  opacity: 0.6;
  animation-duration: 5s;
}

.md-device.open .md-portal {
  box-shadow:
    0 0 0 6px rgba(0, 0, 0, 0.45),
    0 0 46px color-mix(in srgb, var(--portal) 75%, transparent),
    inset 0 0 30px rgba(0, 0, 0, 0.6);
  animation: md-breathe 3s ease-in-out infinite;
}

@keyframes md-breathe {
  50% {
    box-shadow:
      0 0 0 6px rgba(0, 0, 0, 0.45),
      0 0 70px color-mix(in srgb, var(--portal) 85%, transparent),
      inset 0 0 20px rgba(0, 0, 0, 0.5);
  }
}

.md-portal-mark {
  position: relative;
  font-family: var(--font-display);
  font-size: 46px;
  line-height: 1;
  color: color-mix(in srgb, var(--portal) 80%, #fff);
  text-shadow: 0 0 12px var(--portal), 0 2px 6px #000;
}

.md-flash {
  position: absolute;
  inset: 19%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, color-mix(in srgb, var(--portal) 80%, #fff) 30%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.md-device.opening .md-flash {
  animation: md-flash 0.9s ease-out forwards;
}

.md-device.opening .md-runes {
  animation-duration: 3s;
}

.md-device.opening .md-portal-swirl {
  opacity: 1;
  animation-duration: 0.8s;
}

@keyframes md-flash {
  0% {
    opacity: 0;
    transform: scale(0.3);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: scale(1.7);
  }
}

/* the four Sextant orbs, set into the corners of the device */
.md-orb {
  position: absolute;
  width: 38px;
  height: 38px;
